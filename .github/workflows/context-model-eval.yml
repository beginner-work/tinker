name: Context model evals (EdNet ZPD + source ZPD)

# Offline graph/BKT/label logic always runs (after unit).
# Keyed baselines (Claude / Jev via AI Gateway / Braintrust) need unit green,
# and on pull_request only when context-model paths change. Push to main always
# runs keyed (when secrets exist) and records a new experiment-log baseline.
# Never fabricates scores when secrets are missing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  context-model-unit:
    name: Context model unit tests (no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Context-model package tests
        run: npm test --prefix packages/context-model

      - name: Context-model API + eval offline tests
        run: node --test tests/context-model.test.js

  # Path filter for keyed evals on PRs. Push to main always runs keyed.
  keyed-paths:
    name: Decide whether keyed evals run
    runs-on: ubuntu-latest
    outputs:
      run_keyed: ${{ steps.decide.outputs.run_keyed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Path filter (PR) / always on main push
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_keyed=true" >> "$GITHUB_OUTPUT"
            echo "Keyed evals: push/main (always when secrets present)"
            exit 0
          fi
          # Keyed paths: packages/context-model, evals/, api/context-model*,
          # prisma schema, this workflow.
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -Eq \
            '^(packages/context-model/|evals/|api/context-model|prisma/schema\.prisma|\.github/workflows/context-model-eval\.yml)'; then
            echo "run_keyed=true" >> "$GITHUB_OUTPUT"
            echo "Keyed evals: PR touches context-model paths"
          else
            echo "run_keyed=false" >> "$GITHUB_OUTPUT"
            echo "Keyed evals: skipped (PR outside context-model paths)"
          fi

  context-model-eval-offline:
    name: Offline EdNet + source ZPD (always)
    needs: context-model-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache EdNet KT3 + Contents
        uses: actions/cache@v4
        with:
          path: evals/ednet-zpd/.cache
          key: ednet-kt3-contents-v1

      - name: Download EdNet when cache miss
        run: |
          if [ -d evals/ednet-zpd/.cache/kt3 ] && [ -d evals/ednet-zpd/.cache/contents ]; then
            echo "EdNet cache hit"
          else
            python3 -m pip install --user gdown
            node evals/ednet-zpd/download.js
          fi

      - name: Snapshot committed experiment log (regression baseline)
        run: |
          cp evals/experiment-log/experiments.jsonl /tmp/experiments-baseline.jsonl
          wc -l /tmp/experiments-baseline.jsonl

      - name: Offline EdNet ZPD (dev split, v0 baseline)
        run: node evals/ednet-zpd/run.js
        env:
          EDNET_SAMPLE_SEED: "42"
          EDNET_SAMPLE_USERS: "200"
          EDNET_SAMPLE_EVENTS: "1500"
          EVAL_SPLIT: dev
          EVAL_SPLIT_SEED: "42"
          TINKER_EVAL_CONFIG_VERSION: v0
          JEV_EVAL_PIN: "1"

      - name: Offline source ZPD (dev split, internal)
        run: node evals/source-zpd/run.js
        env:
          EVAL_SPLIT: dev
          EVAL_SPLIT_SEED: "42"
          TINKER_EVAL_CONFIG_VERSION: v0
          JEV_EVAL_PIN: "1"

      - name: Gate on last recorded EdNet ZPD baseline
        env:
          # Absolute tolerance on [0,1] accuracy / macro-F1 (2pp). Documented in
          # evals/experiment-log/README.md and evals/lib/check-baseline-regression.js.
          EVAL_BASELINE_TOLERANCE: "0.02"
        run: |
          node evals/lib/check-baseline-regression.js \
            --report evals/ednet-zpd/last-report.json \
            --baseline /tmp/experiments-baseline.jsonl \
            --benchmark ednet-zpd \
            --split dev

  context-model-eval-keyed:
    name: Keyed EdNet + source ZPD (AI Gateway / Claude / Braintrust)
    needs: [context-model-unit, keyed-paths]
    if: needs.context-model-unit.result == 'success' && needs.keyed-paths.outputs.run_keyed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache EdNet KT3 + Contents
        uses: actions/cache@v4
        with:
          path: evals/ednet-zpd/.cache
          key: ednet-kt3-contents-v1

      - name: Download EdNet when cache miss
        run: |
          if [ -d evals/ednet-zpd/.cache/kt3 ] && [ -d evals/ednet-zpd/.cache/contents ]; then
            echo "EdNet cache hit"
          else
            python3 -m pip install --user gdown
            node evals/ednet-zpd/download.js
          fi

      - name: Snapshot committed experiment log (regression baseline)
        run: cp evals/experiment-log/experiments.jsonl /tmp/experiments-baseline.jsonl

      - name: Check optional secrets
        id: secrets
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          missing=()
          # Jev + Claude both route via Vercel AI Gateway only in Actions.
          # ANTHROPIC_API_KEY is not used here (not in repo secrets).
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            missing+=("AI_GATEWAY_API_KEY");
          fi
          if [ -z "$BRAINTRUST_API_KEY" ]; then
            missing+=("BRAINTRUST_API_KEY");
          fi

          # Keyed model calls need AI Gateway; Braintrust is optional logging.
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "skip_keyed=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_keyed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$BRAINTRUST_API_KEY" ]; then
            echo "skip_braintrust=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_braintrust=false" >> "$GITHUB_OUTPUT"
          fi

          echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## Context-model keyed evals — secret status"
              echo ""
              if [ -z "$AI_GATEWAY_API_KEY" ]; then
                echo "Keyed Jev/Claude **skipped**: \`AI_GATEWAY_API_KEY\` is not set in GitHub Actions secrets."
              else
                echo "Keyed Jev/Claude will run via AI Gateway (\`anthropic/claude-*\` + \`typesafe-ai/jev\`)."
                echo ""
                echo "Note: AI Gateway **free tier** cannot call some models. If runs soft-skip with"
                echo "\"Free tier users do not have access\", top up AI Gateway credits on the Vercel team."
                echo "No scores are fabricated on skip. \`ANTHROPIC_API_KEY\` is not required in Actions."
              fi
              echo ""
              echo "Still missing (mirror from Vercel tinker **Production** only - never Preview):"
              for s in "${missing[@]}"; do echo "- \`$s\`"; done
              echo ""
              echo "Required for keyed runs: \`AI_GATEWAY_API_KEY\` (+ \`BRAINTRUST_API_KEY\` for logging)."
              echo "Jev model: \`typesafe-ai/jev\` (evals pin \`typesafe-ai/jev-1.14.0\`)."
              echo "Claude model: \`anthropic/claude-haiku-4-5-20251001\` via AI Gateway."
            } | tee /tmp/context-model-eval-secrets.md
          else
            {
              echo "All keyed secrets present (\`AI_GATEWAY_API_KEY\`, \`BRAINTRUST_API_KEY\`)."
              echo "Claude + Jev route through AI Gateway only — no \`ANTHROPIC_API_KEY\` in Actions."
              echo "Soft-skip on gateway access denial (no fabricated scores)."
            } | tee /tmp/context-model-eval-secrets.md
          fi

      - name: Post secret status on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/context-model-eval-secrets.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Keyed EdNet + source runs
        if: steps.secrets.outputs.skip_keyed != 'true'
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Claude Messages via AI Gateway (anthropic/claude-*); no ANTHROPIC_API_KEY.
          ASK_MODEL: anthropic/claude-haiku-4-5-20251001
          JEV_EVAL_PIN: "1"
          JEV_MODEL: typesafe-ai/jev-1.14.0
          EVAL_SPLIT: dev
          EVAL_SPLIT_SEED: "42"
          TINKER_EVAL_CONFIG_VERSION: v0
          EDNET_SAMPLE_SEED: "42"
          EDNET_SAMPLE_USERS: "200"
          EDNET_SAMPLE_EVENTS: "1500"
          EVAL_KEYED_LIMIT: "40"
        run: |
          node evals/ednet-zpd/run.js
          node evals/source-zpd/run.js

      - name: Gate keyed EdNet report vs last recorded baseline
        if: steps.secrets.outputs.skip_keyed != 'true'
        env:
          EVAL_BASELINE_TOLERANCE: "0.02"
        run: |
          node evals/lib/check-baseline-regression.js \
            --report evals/ednet-zpd/last-report.json \
            --baseline /tmp/experiments-baseline.jsonl \
            --benchmark ednet-zpd \
            --split dev

      # One path per invocation — multiline `paths:` was executed as a second
      # shell command (`evals/source-zpd` → exit 126). Primary scores already
      # logged above via run.js + Braintrust SDK.
      - name: Braintrust eval-action (ednet)
        if: steps.secrets.outputs.skip_keyed != 'true' && steps.secrets.outputs.skip_braintrust != 'true'
        uses: braintrustdata/eval-action@v2
        with:
          api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          runtime: node
          root: .
          paths: evals/ednet-zpd
          package_manager: npm
          use_proxy: false
          terminate_on_failure: false
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ASK_MODEL: anthropic/claude-haiku-4-5-20251001
          JEV_EVAL_PIN: "1"
          JEV_MODEL: typesafe-ai/jev-1.14.0
          EDNET_SAMPLE_SEED: "42"
          EDNET_SAMPLE_USERS: "200"
          EDNET_SAMPLE_EVENTS: "1500"

      - name: Braintrust eval-action (source)
        if: steps.secrets.outputs.skip_keyed != 'true' && steps.secrets.outputs.skip_braintrust != 'true'
        uses: braintrustdata/eval-action@v2
        with:
          api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          runtime: node
          root: .
          paths: evals/source-zpd
          package_manager: npm
          use_proxy: false
          terminate_on_failure: false
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ASK_MODEL: anthropic/claude-haiku-4-5-20251001
          JEV_EVAL_PIN: "1"
          JEV_MODEL: typesafe-ai/jev-1.14.0

      - name: Record baseline artifact (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: context-model-experiment-log
          path: |
            evals/experiment-log/experiments.jsonl
            evals/ednet-zpd/last-report.json
          if-no-files-found: warn
