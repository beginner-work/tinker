name: Preview Smoke

# Fires on every PR push; polls Vercel for the matching preview, drives
# Browserbase through tests/preview/scenarios.json against the preview URL,
# and upserts a single PR comment with the results (the comment is the
# boundary that Claude reads via subscribe_pr_activity).
#
# Forks have no secret access; the if: guard below silently skips that case.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run Browserbase smoke against Vercel preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pull Vercel project's preview env (Browserbase + project IDs) into
      # .env.local so the runner can read them without duplicating secrets
      # to GitHub. Mirrors the local flow: `vercel link` + `vercel env pull`.
      - name: Pull preview env from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest link --yes \
            --project=tinker --scope=beginner-work --token="$VERCEL_TOKEN"
          npx vercel env pull .env.local \
            --environment=preview --token="$VERCEL_TOKEN"
          # VERCEL_PROJECT_ID is in .vercel/project.json after link; expose
          # it to the next step so the runner can poll the Vercel REST API.
          echo "VERCEL_PROJECT_ID=$(node -p 'require("./.vercel/project.json").projectId')" >> "$GITHUB_ENV"

      - name: Run preview smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCREENSHOTS_DIR: ${{ runner.temp }}/preview-screenshots
        run: node scripts/run-preview-smoke.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-screenshots-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/preview-screenshots
          if-no-files-found: ignore
          retention-days: 14
