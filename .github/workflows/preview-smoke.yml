name: Preview Smoke

# When the Vercel GitHub app reports a preview deploy as ready, we POST
# to /api/preview-smoke on the same preview URL. The function runs inside
# the deployment it's testing, so Browserbase keys come natively from
# the Vercel project env. No new secrets needed: the function authenticates
# the caller solely by the GITHUB_TOKEN we forward (used to upsert the
# results comment back into the PR).

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL (e.g. https://tinker-abc.vercel.app)'
        required: true
      pr_number:
        description: 'PR number to comment on'
        required: true
      sha:
        description: 'Commit SHA (full 40 chars)'
        required: true

concurrency:
  group: preview-smoke-${{ github.event.deployment.sha || inputs.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Drive Browserbase against the new preview
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview' &&
       github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Resolve preview context
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            let previewUrl, sha, prNumber;
            if (context.eventName === 'workflow_dispatch') {
              previewUrl = context.payload.inputs.preview_url;
              sha = context.payload.inputs.sha;
              prNumber = Number(context.payload.inputs.pr_number);
            } else {
              previewUrl = context.payload.deployment_status.environment_url;
              sha = context.payload.deployment.sha;
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: sha,
              });
              prNumber = data[0]?.number;
            }
            core.info(`previewUrl=${previewUrl}`);
            core.info(`sha=${sha}`);
            core.info(`prNumber=${prNumber}`);
            if (!previewUrl || !sha || !prNumber) {
              core.warning('Missing context; skipping.');
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('previewUrl', previewUrl);
            core.setOutput('sha', sha);
            core.setOutput('prNumber', String(prNumber));

      - name: POST /api/preview-smoke
        id: post
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.ctx.outputs.previewUrl }}
          SHA: ${{ steps.ctx.outputs.sha }}
          PR_NUMBER: ${{ steps.ctx.outputs.prNumber }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const sha = process.env.SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            const body = JSON.stringify({
              previewUrl,
              sha,
              prNumber,
              repo: `${context.repo.owner}/${context.repo.repo}`,
            });
            core.info(`POST ${previewUrl}/api/preview-smoke`);
            core.info(`body=${body}`);
            const res = await fetch(`${previewUrl}/api/preview-smoke`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Github-Token': process.env.GITHUB_TOKEN,
              },
              body,
              signal: AbortSignal.timeout(120_000),
            });
            const text = await res.text();
            core.info(`status=${res.status}`);
            core.info(`response=${text.slice(0, 2000)}`);
            if (!res.ok) {
              core.setFailed(`function returned ${res.status}: ${text.slice(0, 500)}`);
            }

      - name: Post diagnostic comment on failure
        if: failure() && steps.ctx.outputs.prNumber != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.ctx.outputs.prNumber }}');
            if (!pr) return;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- tinker-preview-smoke-diag -->';
            const body = [
              marker,
              '### Preview smoke — workflow failed',
              `Run: ${runUrl}`,
              `Trigger: \`${context.eventName}\``,
              `Preview URL: \`${{ steps.ctx.outputs.previewUrl }}\``,
              `SHA: \`${{ steps.ctx.outputs.sha }}\``,
              '',
              'Open the run link above for step output.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
