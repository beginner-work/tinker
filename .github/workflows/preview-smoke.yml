name: Preview Smoke

# When the Vercel GitHub app reports a preview deploy as ready, we POST
# to /api/preview-smoke on the same preview URL. The function runs inside
# the deployment it's testing, so Browserbase keys come natively from
# the Vercel project env — no Vercel CLI, no VERCEL_TOKEN, no key
# duplication to GitHub. No new secrets needed: the function authenticates
# the caller solely by the GITHUB_TOKEN we forward (used to upsert the
# results comment back into the PR).

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL to drive Browserbase at (e.g. https://tinker-abc.vercel.app)'
        required: true
      pr_number:
        description: 'PR number to comment on'
        required: true
      sha:
        description: 'Commit SHA (full 40 chars)'
        required: true

concurrency:
  group: preview-smoke-${{ github.event.deployment_status.deployment.sha || inputs.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Drive Browserbase against the new preview
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview' &&
       github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Resolve preview context
        id: ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PREVIEW_URL="${{ inputs.preview_url }}"
            SHA="${{ inputs.sha }}"
            PR="${{ inputs.pr_number }}"
          else
            PREVIEW_URL="${{ github.event.deployment_status.environment_url }}"
            SHA="${{ github.event.deployment.sha }}"
            # Look up the PR number for this commit.
            PR=$(curl -sH "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/pulls" \
              | node -e 'const ps=JSON.parse(require("fs").readFileSync(0));console.log(ps[0]?.number ?? "")')
          fi
          if [ -z "$PR" ]; then
            echo "no associated PR for $SHA; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
          fi

      - name: POST /api/preview-smoke on the preview deploy
        if: steps.ctx.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(node -e 'console.log(JSON.stringify({
            previewUrl: process.argv[1],
            sha: process.argv[2],
            prNumber: Number(process.argv[3]),
            repo: process.argv[4]
          }))' \
            "${{ steps.ctx.outputs.preview_url }}" \
            "${{ steps.ctx.outputs.sha }}" \
            "${{ steps.ctx.outputs.pr }}" \
            "${{ github.repository }}")
          curl -fsS --max-time 120 \
            -X POST "${{ steps.ctx.outputs.preview_url }}/api/preview-smoke" \
            -H "Content-Type: application/json" \
            -H "X-Github-Token: $GITHUB_TOKEN" \
            -d "$BODY"
