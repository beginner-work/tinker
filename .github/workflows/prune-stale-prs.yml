name: Prune Stale Pull Requests

on:
  schedule:
    # Daily at 12:00 UTC. The script is a no-op if nothing has crossed the threshold.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List stale PRs without closing them'
        type: boolean
        default: false

jobs:
  prune:
    name: Close PRs with no recent activity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run prune script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/prune-stale-prs.js
