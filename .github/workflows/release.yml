name: Release

# Build the desktop apps and publish them to GitHub Releases whenever a
# version tag is pushed:
#
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags   # triggers this workflow
#
# Each OS job builds its own native installers (electron-builder packages for
# the host platform) and uploads them to the release for the tag via
# `--publish always`. macOS produces the universal tinker-mac.dmg the landing
# page links to.
on:
  push:
    tags:
      - 'v*'
  # Manual runs: a dry run by default (builds, publishes nothing); set
  # `publish` to also cut the GitHub Release for the package.json version —
  # the escape hatch for environments that can build but can't push tags.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (not just build)"
        type: boolean
        default: false
  # Reusable entry point for release-on-marker.yml, which publishes on a
  # version-marker bump merged to main — the release path for sessions that
  # can merge PRs but can't push tags or dispatch workflows.
  workflow_call:
    inputs:
      publish:
        description: "Publish the release (not just build)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Create the tag + release once, up front. The three OS jobs publish
  # concurrently, and when none of them finds the release each races to
  # create it — one POST lands inside GitHub's tag-creation window and the
  # publish dies with 422 "Published releases must have a valid tag" (how
  # v0.1.1 lost its mac build). With the release pre-created, electron-builder
  # only ever uploads assets into it.
  prepare:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tag + release exist
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$version" --notes "tinker desktop v$version"

  release:
    name: Build & publish (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        shell: bash
        # Unset signing secrets get injected as empty strings, and an empty
        # CSC_LINK sends electron-builder down the import-a-certificate path,
        # where "" resolves to the project directory and the build dies with
        # "<dir> not a file". Drop empty signing vars so unsigned builds work.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder --publish ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && 'always' || 'never' }}
        env:
          # GitHub Releases upload.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization (optional). Set these repo
          # secrets to ship a Gatekeeper-clean build; without them the macOS
          # app still builds, just unsigned.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
