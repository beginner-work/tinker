name: Release

# Build the desktop apps and publish them to GitHub Releases whenever a
# version tag is pushed:
#
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags   # triggers this workflow
#
# Each OS job builds its own native installers (electron-builder packages for
# the host platform) and uploads them to the release for the tag via
# `--publish always`. macOS produces the universal tinker-mac.dmg the landing
# page links to.
on:
  push:
    tags:
      - 'v*'
  # Allow a manual dry run (builds, but only publishes on a tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          # GitHub Releases upload.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization (optional). Set these repo
          # secrets to ship a Gatekeeper-clean build; without them the macOS
          # app still builds, just unsigned.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
