name: Ask eval (Braintrust)

# Required merge gate for /api/ask Tyler-voice quality (project tinker-ask).
# When BRAINTRUST_API_KEY or ANTHROPIC_API_KEY is missing, the job skips
# clearly (exit 0) and prints exactly which secrets Tyler must add.
# It never fabricates scores. ELEVENLABS_API_KEY is not required (text-only).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ask-eval:
    name: Ask eval (Braintrust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        id: secrets
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=()
          if [ -z "$BRAINTRUST_API_KEY" ]; then missing+=("BRAINTRUST_API_KEY"); fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then missing+=("ANTHROPIC_API_KEY"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            {
              echo "## Ask eval skipped — missing repo secrets"
              echo ""
              echo "The Braintrust ask eval did **not** run. No scores were fabricated."
              echo ""
              echo "Tyler must add these GitHub Actions secrets (Settings → Secrets and variables → Actions):"
              for s in "${missing[@]}"; do echo "- \`$s\`"; done
              echo ""
              echo "Optional later: make **Ask eval (Braintrust)** a required status check on \`main\`."
              echo "ELEVENLABS_API_KEY is **not** required for this text-only gate."
              echo "Never use voice id \`JlYdFGRHWwlz51Zh5K2n\`."
            } | tee /tmp/ask-eval-skip.md
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Both BRAINTRUST_API_KEY and ANTHROPIC_API_KEY are present — running eval."

      - name: Post skip comment on PR
        if: steps.secrets.outputs.skip == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/ask-eval-skip.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Run Braintrust ask eval
        if: steps.secrets.outputs.skip != 'true'
        uses: braintrustdata/eval-action@v2
        with:
          api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          runtime: node
          root: .
          paths: evals/ask
          package_manager: npm
          use_proxy: false
          terminate_on_failure: true
          report_scores: TylerAgreement, CasePass, KeywordExpect, SentenceBudget, GroundingJudge, ToolUseDecision, ResumeAfterInterrupt
          report_metrics: |
            latency_ms
            Duration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASK_MODEL: claude-haiku-4-5-20251001
          ASK_JUDGE_MODEL: claude-haiku-4-5-20251001
          READING_MODEL: claude-haiku-4-5-20251001
