# electron-builder configuration for the tinker desktop app.
#
# The Mac/Windows/Linux shell is a hardened Electron BrowserWindow that
# loads production Tinker (https://tinker.beginner.work). Packaging is
# just "wrap the main/preload entry points in Electron" — the product UI
# ships from the web deploy, so most product changes need no new dmg.
#
#   npm run dist          # package for the current OS
#   npm run dist:linux    # AppImage + tar.gz   (build on Linux)
#   npm run dist:mac      # universal dmg + zip (build on macOS)
#   npm run dist:win      # nsis + portable      (build on Windows / wine)
#   npm run pack          # unpacked dir only, for a quick smoke test
#
appId: com.beginner.tinker
productName: tinker
copyright: © beginner

# Published to GitHub Releases by .github/workflows/release.yml on tag push
# (electron-builder --publish always uploads the artifacts for the tag).
publish:
  provider: github
  owner: beginner-work
  repo: tinker
  # Publish as a real release, not a draft — the landing page links to
  # releases/latest/download/…, which never serves draft assets.
  releaseType: release

directories:
  output: dist
  buildResources: build

# Nothing to rebuild — the shell is plain JS; product UI is remote.
npmRebuild: false
asar: true

# Ship only the desktop shell. The shared renderer is loaded from
# production at runtime; Prisma belongs to the web / API variant.
files:
  - src/main/**/*
  - src/renderer/icons/tinker-icon-512.png
  - package.json
  - "!**/*.map"
  - "!node_modules/@prisma/**"
  - "!node_modules/.prisma/**"
  - "!node_modules/prisma/**"

linux:
  executableName: tinker
  # Match the .desktop filename + StartupWMClass to Electron's runtime app_id
  # (read from package.json "desktopName") so window managers group windows
  # under this launcher.
  syncDesktopName: true
  target:
    - AppImage
    - tar.gz
  category: Network
  icon: src/renderer/icons/tinker-icon-512.png
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  # One universal (Intel + Apple Silicon) build, so a single download runs on
  # any Mac — under a stable name the beginner landing page links straight to
  # (releases/latest/download/tinker-mac.dmg).
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.productivity
  icon: src/renderer/icons/tinker-icon-512.png
  artifactName: tinker-mac.${ext}
  # hardenedRuntime + a Developer ID signing identity (provided via CI secrets)
  # are what let notarization succeed; without secrets the build is unsigned.
  # This project currently ships unsigned (no Apple Developer account).
  hardenedRuntime: true
  identity: null

win:
  target:
    - nsis
    - portable
  icon: src/renderer/icons/tinker-icon-512.png
  artifactName: ${productName}-${version}-${arch}.${ext}
