<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-background); display: flex; gap: 14px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .box { width: 100%; height: 80px; background: var(--color-surface-alt); border: 1px solid var(--color-border); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--color-foreground); }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); }
</style>
</head>
<body>
<div class="item"><div class="box" style="border-radius: 8px;"></div><span class="name">Icon btn</span><span class="val">8px</span></div>
<div class="item"><div class="box" style="border-radius: 9px;"></div><span class="name">Session</span><span class="val">9px</span></div>
<div class="item"><div class="box" style="border-radius: 10px;"></div><span class="name">Button</span><span class="val">10px</span></div>
<div class="item"><div class="box" style="border-radius: 12px;"></div><span class="name">Card</span><span class="val">12px</span></div>
<div class="item"><div class="box" style="border-radius: 44px;"></div><span class="name">Logo tile</span><span class="val">44px</span></div>
<div class="item"><div class="box" style="border-radius: 999px;"></div><span class="name">Pill</span><span class="val">999px</span></div>
</body>
</html>
