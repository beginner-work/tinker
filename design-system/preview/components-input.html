<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview · Search input</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-background); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; width: 100%; height: 56px; padding: 0 6px 0 20px; border-radius: 999px; background: var(--color-surface); border: 1px solid var(--color-border); align-items: center; gap: 8px; box-shadow: var(--shadow-soft); }
  .field.focus { border-color: var(--color-accent-strong); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18), var(--shadow-soft); }
  .field input { flex: 1; background: transparent; border: none; padding: 0; font-size: 15px; font: inherit; outline: none; color: var(--color-foreground); }
  .field input::placeholder { color: var(--color-muted); }
  .field button { height: 44px; padding: 0 26px; border-radius: 999px; background: var(--color-accent-strong); color: #fff; font-weight: 600; font-size: 14px; border: none; box-shadow: var(--shadow-purple); cursor: pointer; }
  .meta { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); }
</style>
</head>
<body>
  <span class="meta">Default</span>
  <div class="field"><input placeholder="Start a new web" /><button>Begin</button></div>
  <span class="meta">Focused</span>
  <div class="field focus"><input value="hop tinctures" /><button>Begin</button></div>
</body>
</html>
