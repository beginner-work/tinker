<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview · Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-background); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch {
    border-radius: var(--radius-card);
    padding: 12px;
    height: 92px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid var(--color-border);
    color: var(--color-foreground);
  }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 13px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--color-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background: var(--color-background);">
    <span class="name">Background</span><span class="hex">#fffdf7</span>
  </div>
  <div class="swatch" style="background: var(--color-surface-alt);">
    <span class="name">Card</span><span class="hex">#fff9f0</span>
  </div>
  <div class="swatch" style="background: var(--color-surface);">
    <span class="name">Surface</span><span class="hex">#ffffff</span>
  </div>
  <div class="swatch" style="background: var(--color-parchment);">
    <span class="name">Parchment</span><span class="hex">#f7f0e3</span>
  </div>
  <div class="swatch" style="background: var(--color-cream);">
    <span class="name">Cream</span><span class="hex">#f5f3ef</span>
  </div>
</div>
</body>
</html>
