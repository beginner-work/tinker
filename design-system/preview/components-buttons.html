<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview · Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-background); display: flex; flex-direction: column; gap: 14px; align-items: flex-start; font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: center; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); width: 110px; }
  .begin { height: 44px; padding: 0 26px; border-radius: 999px; background: var(--color-accent-strong); color: #fff; font-weight: 600; font-size: 14px; border: none; box-shadow: var(--shadow-purple); cursor: pointer; }
  .new { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: rgba(45, 90, 61, 0.06); color: var(--color-forest); font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; color: var(--color-foreground); border: none; background: transparent; cursor: pointer; }
  .icon:hover { background: rgba(45, 90, 61, 0.08); }
  svg { width: 15px; height: 15px; }
</style>
</head>
<body>
  <div class="row"><span class="label">Primary</span><button class="begin">Begin</button></div>
  <div class="row"><span class="label">Tonal</span>
    <button class="new"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>New session</button>
  </div>
  <div class="row"><span class="label">Icon</span>
    <button class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2v-9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
  </div>
</body>
</html>
