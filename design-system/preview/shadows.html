<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview · Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 36px 24px; background: var(--color-background); display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 100%; height: 70px; background: var(--color-surface); border-radius: var(--radius-card); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--color-foreground); }
  .ring { box-shadow: var(--focus-ring); border-color: var(--color-accent-strong); }
  .soft { box-shadow: var(--shadow-soft); }
  .purple { box-shadow: var(--shadow-purple); background: var(--color-accent-strong); color: #fff; border: none; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--color-foreground); }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); text-align: center; }
</style>
</head>
<body>
<div class="item"><div class="box soft">soft</div><span class="name">Shadow soft</span><span class="val">green-tinted ambient<br/>cards, search field</span></div>
<div class="item"><div class="box purple">purple</div><span class="name">Shadow purple</span><span class="val">indigo-tinted<br/>primary CTA only</span></div>
<div class="item"><div class="box ring">focus</div><span class="name">Focus ring</span><span class="val">indigo halo · 4px · 18%</span></div>
</body>
</html>
