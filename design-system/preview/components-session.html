<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview · Sidebar sessions</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--color-parchment); font-family: var(--font-sans); }
  .sessions { display: flex; flex-direction: column; gap: 1px; }
  .session { display: flex; align-items: center; gap: 9px; padding: 8px 9px 8px 10px; border-radius: 9px; color: var(--color-muted); font-size: 13px; font-weight: 500; border: 1px solid transparent; }
  .session.hover { background: rgba(255, 255, 255, 0.55); color: var(--color-foreground); }
  .session.selected { background: var(--color-surface); color: var(--color-foreground); font-weight: 600; border-color: var(--color-border); box-shadow: 0 1px 2px rgba(45, 90, 61, 0.04); }
  .icn { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--color-forest); }
  .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cl { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--color-muted); }
  .session.selected .cl, .session.hover .cl { background: rgba(45, 42, 38, 0.06); }
  .spinner { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--color-border); border-top-color: var(--color-forest); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="sessions">
  <div class="session selected">
    <span class="icn"><svg viewBox="0 0 16 16" width="14" height="14" fill="none"><circle cx="8" cy="8" r="6" stroke="#c8b6e2" stroke-width="1.6"/><line x1="2" y1="8" x2="14" y2="8" stroke="#fdba74" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="2" x2="8" y2="14" stroke="#6ee7b7" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="8" cy="8" rx="3" ry="6" stroke="#7dd3fc" stroke-width="1.6"/></svg></span>
    <span class="ttl">New session</span>
    <span class="cl"><svg viewBox="0 0 24 24" width="11" height="11" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
  </div>
  <div class="session hover">
    <span class="icn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
    <span class="ttl">hop tinctures</span>
    <span class="cl"><svg viewBox="0 0 24 24" width="11" height="11" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
  </div>
  <div class="session">
    <span class="icn"><span class="spinner"></span></span>
    <span class="ttl">wikipedia.org</span>
  </div>
  <div class="session">
    <span class="icn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
    <span class="ttl">are.na</span>
  </div>
</div>
</body>
</html>
