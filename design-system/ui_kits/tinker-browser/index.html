<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tinker · UI kit</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  /* tinker chrome — mirrors src/renderer/styles.css, trimmed of
     webview-specific bits we don't have here. */
  html, body { margin: 0; height: 100vh; overflow: hidden; }
  body { display: flex; flex-direction: row; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: transparent; }
  input { font: inherit; color: inherit; }
  input:focus, button:focus { outline: none; }

  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    height: 100vh;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--color-parchment) 0%, var(--color-cream) 100%);
    border-right: 1px solid var(--color-border);
    user-select: none;
  }
  .sidebar__head { padding: 18px 16px 6px; }
  .sidebar__brand { display: flex; align-items: center; gap: 9px; padding-left: 4px; }
  .sidebar__name { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; color: var(--color-ink); }
  .sidebar__nav { display: flex; align-items: center; gap: 2px; padding: 8px 12px 4px; }
  .sidebar__new { display: flex; align-items: center; gap: 8px; margin: 6px 12px 10px; padding: 9px 12px; border-radius: 10px; background: rgba(45, 90, 61, 0.06); color: var(--color-forest); font-size: 13px; font-weight: 600; transition: background 0.15s ease, transform 0.05s ease; }
  .sidebar__new:hover { background: rgba(45, 90, 61, 0.10); }
  .sidebar__new:active { transform: scale(0.99); }
  .sidebar__label { padding: 6px 18px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); }
  .sidebar__sessions { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 8px 12px; }
  .sidebar__footer { padding: 8px 18px 14px; font-size: 11px; color: var(--color-muted); border-top: 1px solid rgba(237, 232, 224, 0.5); }

  .session { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 9px 8px 10px; border-radius: 9px; background: transparent; color: var(--color-muted); font-size: 13px; font-weight: 500; text-align: left; transition: background 0.12s ease, color 0.12s ease; margin-bottom: 1px; border: 1px solid transparent; }
  .session:hover { background: rgba(255, 255, 255, 0.55); color: var(--color-foreground); }
  .session[aria-selected="true"] { background: var(--color-surface); color: var(--color-foreground); font-weight: 600; border-color: var(--color-border); box-shadow: 0 1px 2px rgba(45, 90, 61, 0.04); }
  .session__icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--color-forest); }
  .session__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session__close { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--color-muted); opacity: 0; transition: opacity 0.12s ease, background 0.12s ease; flex-shrink: 0; }
  .session:hover .session__close, .session[aria-selected="true"] .session__close { opacity: 1; }
  .session__close:hover { background: rgba(45, 42, 38, 0.08); color: var(--color-foreground); }
  .session__spinner { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--color-border); border-top-color: var(--color-forest); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; color: var(--color-foreground); transition: background 0.12s ease, transform 0.05s ease; }
  .icon-btn:hover { background: rgba(45, 90, 61, 0.08); }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn:disabled { color: #c9c2b6; cursor: default; background: transparent; }

  .stage { flex: 1; position: relative; background: var(--color-background); overflow: hidden; min-width: 0; }
  .stage > .welcome, .stage > .search-pane { position: absolute; inset: 0; display: none; }
  .stage > .welcome[data-active] { display: flex; }
  .stage > .search-pane[data-active] { display: block; }

  .welcome { flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow: auto; background: radial-gradient(circle at 20% 12%, rgba(123, 196, 122, 0.10), transparent 42%), radial-gradient(circle at 88% 18%, rgba(165, 180, 252, 0.12), transparent 38%), radial-gradient(circle at 50% 110%, rgba(253, 186, 116, 0.08), transparent 50%), var(--color-background); }
  .welcome__inner { max-width: 560px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px; margin-top: -6vh; }
  .welcome__title { margin: 0; font-family: var(--font-display); font-size: 38px; font-weight: 700; letter-spacing: -0.02em; color: var(--color-foreground); text-align: center; }
  .welcome__search { display: flex; width: 100%; max-width: 520px; height: 56px; padding: 0 6px 0 20px; border-radius: 999px; background: var(--color-surface); border: 1px solid var(--color-border); align-items: center; gap: 8px; box-shadow: var(--shadow-soft); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .welcome__search:focus-within { border-color: var(--color-accent-strong); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18), var(--shadow-soft); }
  .welcome__search input { flex: 1; background: transparent; border: none; padding: 0; font-size: 15px; min-width: 0; }
  .welcome__search input::placeholder { color: var(--color-muted); }
  .welcome__begin { height: 44px; padding: 0 26px; border-radius: 999px; background: var(--color-accent-strong); color: #fff; font-weight: 600; font-size: 14px; transition: background 0.15s ease, transform 0.05s ease; box-shadow: var(--shadow-purple); }
  .welcome__begin:hover { background: #4f46e5; }
  .welcome__begin:active { transform: scale(0.98); }

  .search-pane { background: var(--color-background); overflow: auto; padding: 56px 32px 64px; }
  .search-pane__inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .search-pane__header { display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--color-border); padding-bottom: 14px; }
  .search-pane__crumb { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-forest); }
  .search-pane__query { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--color-foreground); }
  .search-pane__essay { font-family: var(--font-display); font-size: 17px; line-height: 1.7; color: var(--color-foreground); }
  .search-pane__essay p { margin: 0 0 1em; }
  .search-pane__essay a { color: var(--color-accent-strong); text-decoration: underline; text-decoration-color: rgba(99, 102, 241, 0.4); text-underline-offset: 3px; }
  .search-pane__essay a:hover { color: #4f46e5; }
  .search-pane__loading { display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--color-muted); font-size: 14px; }
  .thinking-dots { display: inline-flex; gap: 4px; }
  .thinking-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent-strong); animation: bounce 1.2s ease-in-out infinite; }
  .thinking-dot:nth-child(2) { animation-delay: 0.18s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }
  .search-pane__error { padding: 16px 18px; border-radius: 12px; background: var(--color-error-bg); border: 1px solid var(--color-error-border); font-size: 14px; line-height: 1.55; }
  .search-pane__error p { margin: 0 0 0.6em; }
  .search-pane__error p:last-child { margin: 0; }
  .search-pane__error code { font-family: var(--font-mono); font-size: 12.5px; background: rgba(45, 42, 38, 0.06); padding: 1px 5px; border-radius: 4px; }
  .search-pane__error-hint { color: var(--color-muted); font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="./Logo.jsx"></script>
<script type="text/babel" src="./Session.jsx"></script>
<script type="text/babel" src="./Sidebar.jsx"></script>
<script type="text/babel" src="./WelcomePage.jsx"></script>
<script type="text/babel" src="./SearchPane.jsx"></script>

<script type="text/babel">
  function uid() { return "s_" + Math.random().toString(36).slice(2, 8); }

  function App() {
    const [sessions, setSessions] = React.useState([
      { id: uid(), kind: "home", title: "New session", loading: false },
    ]);
    const [activeId, setActiveId] = React.useState(() => sessions[0].id);

    const update = (id, patch) => setSessions((arr) => arr.map((s) => (s.id === id ? { ...s, ...patch } : s)));

    const newSession = () => {
      const s = { id: uid(), kind: "home", title: "New session", loading: false };
      setSessions((arr) => [...arr, s]);
      setActiveId(s.id);
    };

    const closeSession = (id) => {
      setSessions((arr) => {
        const idx = arr.findIndex((s) => s.id === id);
        const next = arr.filter((s) => s.id !== id);
        if (next.length === 0) return [{ id: uid(), kind: "home", title: "New session", loading: false }];
        if (id === activeId) {
          const fallback = next[idx] || next[idx - 1];
          if (fallback) setActiveId(fallback.id);
        }
        return next;
      });
    };

    const goHome = () => {
      const active = sessions.find((s) => s.id === activeId);
      if (!active) return;
      update(activeId, { kind: "home", title: "New session", state: undefined, loading: false });
    };

    const submitQuery = (q) => {
      update(activeId, { kind: "search", title: q, state: "loading", query: q, loading: true });
      setTimeout(() => {
        if (q.toLowerCase() === "error") {
          update(activeId, { state: "error", message: "ANTHROPIC_API_KEY is not set.", loading: false });
        } else {
          update(activeId, { state: "ready", loading: false });
        }
      }, 1400);
    };

    const reload = () => {
      const active = sessions.find((s) => s.id === activeId);
      if (!active || active.kind !== "search") return;
      submitQuery(active.query);
    };

    const active = sessions.find((s) => s.id === activeId);

    return (
      <>
        <Sidebar
          sessions={sessions}
          activeId={activeId}
          onSelect={setActiveId}
          onClose={closeSession}
          onNew={newSession}
          onHome={goHome}
          onReload={reload}
        />
        <main className="stage">
          {active && active.kind === "home" && <WelcomePage onSubmit={submitQuery} />}
          {active && active.kind === "search" && (
            <SearchPane query={active.query} state={active.state} message={active.message} />
          )}
        </main>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
