appId: co.tinker.chat
productName: tinker
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  # TODO: code signing — set CSC_LINK / CSC_KEY_PASSWORD and add hardenedRuntime
win:
  target:
    - target: nsis
      arch:
        - x64
  # TODO: code signing — set CSC_LINK / CSC_KEY_PASSWORD
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
