<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="A word from the founder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5c3f"/>
      <stop offset="1" stop-color="#234731"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#3a7050" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#234731" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <!-- founder silhouette -->
  <g fill="#f5f3ef" opacity="0.92">
    <circle cx="300" cy="168" r="60"/>
    <path d="M196 320 c0 -62 47 -104 104 -104 c57 0 104 42 104 104 z"/>
  </g>
  <text x="300" y="364" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600"
        letter-spacing="0.14em" fill="#f5f3ef" opacity="0.86">A WORD FROM THE FOUNDER</text>
</svg>
