<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Mobile inbox list</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/design-tokens.css"/>
<link rel="stylesheet" href="/mobile-drawer.css"/>
<style>
  html, body { height: 100%; margin: 0; }
  /* Simulate iOS standalone safe areas in the capture viewport. */
  body.messages-shell-open .sidebar {
    padding-top: max(env(safe-area-inset-top, 0px), 47px);
    padding-bottom: max(env(safe-area-inset-bottom, 0px), 34px);
  }
</style>
</head>
<body class="messages-shell-open messages-inbox-primary messages-mobile-thread messages-thread-active messages-you-active">
<button id="drawer-toggle" class="drawer-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
<div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>
<aside class="sidebar sidebar--inbox" id="sidebar-messages">
  <header class="sidebar__top"><button class="sidebar__brand" type="button" id="nav-home"><span class="sidebar__name">tinker</span></button></header>
  <nav class="messages-rail">
    <div class="messages-rail__head"><span class="messages-rail__title">Inbox</span></div>
    <div class="messages-rail__you" data-messages-you-slot>
      <button type="button" class="messages-rail__row messages-rail__row--you">
        <span class="messages-rail__avatar messages-avatar--photo messages-avatar--brand" aria-hidden="true"><img class="messages-avatar__img" src="/icons/lindow-labs.svg" alt=""/></span>
        <span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Lindow Labs</span></span></span>
      </button>
    </div>
    <label class="messages-rail__search"><input class="messages-rail__search-input" placeholder="Search people or companies" readonly/></label>
    <ul class="messages-rail__list" data-messages-list>
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">★ Stripe</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row messages-rail__row--unread" data-conv-id="1"><span class="messages-rail__avatar">MK</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Morgan Kim</span><span class="messages-rail__time">Today</span></span><span class="messages-rail__preview">referral · referral intro</span><span class="messages-rail__meta"><span class="messages-rail__touch">referral · referral intro · Today</span></span></span></button></li>
          <li><button type="button" class="messages-rail__row" data-conv-id="2"><span class="messages-rail__avatar">SP</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Sam Patel</span><span class="messages-rail__time">Wed</span></span><span class="messages-rail__preview">hiring EM · eng leader note</span><span class="messages-rail__meta"><span class="messages-rail__touch">hiring EM · eng leader note · Wed</span></span></span></button></li>
        </ul>
      </li>
    </ul>
  </nav>
  <nav class="sidebar__secondary" aria-label="More">
    <a class="sidebar__secondary-link" href="/leads">Leads</a>
    <a class="sidebar__secondary-link" href="/career">Career</a>
    <a class="sidebar__secondary-link" href="/autonomy">Autonomy</a>
    <a class="sidebar__secondary-link" href="/mcp/access">MCP access</a>
  </nav>
</aside>
<main class="stage">
  <section class="messages-pane" id="messages-pane">
    <header class="messages-pane__top">
      <button type="button" class="messages-pane__back" data-messages-back aria-label="Back">←</button>
      <span class="messages-pane__avatar messages-avatar--photo messages-avatar--brand" data-messages-avatar aria-hidden="true"><img class="messages-avatar__img" src="/icons/lindow-labs.svg" alt=""/></span>
      <div class="messages-pane__heading"><h2 class="messages-pane__title"><span data-messages-name>Lindow Labs</span><span class="messages-pane__role" data-messages-role hidden></span></h2></div>
    </header>
    <div class="messages-pane__body">
      <div class="messages-pane__thread messages-thread messages-thread--you" data-messages-thread>
        <div class="writing writing--in-messages" style="display:flex">
          <div class="writing__body"><div class="writing__stage">
            <div class="writing-card">
              <div class="writing-recall">
                <div class="writing-recall__line"><img class="writing-recall__pin" src="/icons/tinker-mark.svg" alt="" aria-hidden="true" /><span class="writing-recall__text">Home</span></div>
              </div>
              <h2 class="writing-question">What are you learning right now, sitting here at home?</h2>
            </div>
          </div></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
  // Demo: tap a row → thread; back → list. No half-open drawer.
  document.querySelectorAll("[data-conv-id], .messages-rail__row--you").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.body.classList.add("messages-mobile-thread", "messages-thread-active", "messages-you-active");
    });
  });
  document.querySelector("[data-messages-back]").addEventListener("click", function () {
    document.body.classList.remove("messages-mobile-thread", "messages-thread-active", "messages-you-active");
  });
</script>
</body></html>
