<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>You guided flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/design-tokens.css"/>
</head>
<body class="messages-shell-open messages-inbox-primary messages-thread-active messages-you-active">
<aside class="sidebar sidebar--inbox" style="padding-top:14px">
  <header class="sidebar__top"><button class="sidebar__brand" type="button"><span class="sidebar__name">tinker</span></button></header>
  <nav class="messages-rail">
    <div class="messages-rail__head"><span class="messages-rail__title">Inbox</span></div>
    <div class="messages-rail__you"><button type="button" class="messages-rail__row messages-rail__row--you" aria-current="true"><span class="messages-rail__avatar">TY</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">You</span></span><span class="messages-rail__preview">Story parts and drafts with your assistant</span></span></button></div>
    <label class="messages-rail__search"><input class="messages-rail__search-input" placeholder="Search people or companies" readonly/></label>
    <ul class="messages-rail__list">
      <li class="messages-rail__group"><button type="button" class="messages-rail__group-head"><span class="messages-rail__group-label">Today</span><span class="messages-rail__group-count">1</span></button>
        <ul class="messages-rail__group-list"><li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">AR</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Alex Rivera</span></span><span class="messages-rail__preview">Following up</span></span></button></li></ul>
      </li>
    </ul>
  </nav>
</aside>
<main class="stage">
  <section class="messages-pane">
    <header class="messages-pane__top"><div class="messages-pane__heading"><h2 class="messages-pane__title"><span>You</span><span class="messages-pane__role"> · story parts with your assistant</span></h2></div></header>
    <div class="messages-pane__body"><div class="messages-pane__thread messages-thread messages-thread--you">
      <div class="writing writing--in-messages" style="display:flex">
        <div class="writing__body"><div class="writing__stage">
          <div class="writing-card"><h2 class="writing-question">What are you learning that belongs in your story parts?</h2></div>
        </div></div>
      </div>
    </div></div>
    <footer class="messages-composer messages-composer--you">
      <div class="messages-composer__shell">
        <textarea class="messages-composer__textarea" rows="2">I am learning how eng leaders hire when they already trust a recruiter note.</textarea>
        <div class="messages-composer__actions">
          <button type="button" class="messages-composer__next">Next</button>
          <button type="button" class="messages-composer__ship">Ship</button>
        </div>
      </div>
    </footer>
  </section>
</main>
</body></html>
