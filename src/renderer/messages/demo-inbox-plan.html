<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inbox by company plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/design-tokens.css"/>
</head>
<body class="messages-shell-open messages-inbox-primary">
<aside class="sidebar sidebar--inbox" style="padding-top:14px">
  <header class="sidebar__top"><button class="sidebar__brand" type="button"><span class="sidebar__name">tinker</span></button></header>
  <nav class="messages-rail">
    <div class="messages-rail__head"><span class="messages-rail__title">Inbox</span></div>
    <div class="messages-rail__you"><button type="button" class="messages-rail__row messages-rail__row--you"><span class="messages-rail__avatar messages-avatar--photo messages-avatar--brand" aria-hidden="true"><img class="messages-avatar__img" src="/icons/lindow-labs.svg" alt=""/></span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Lindow Labs</span></span></span></button></div>
    <label class="messages-rail__search"><input class="messages-rail__search-input" placeholder="Search people or companies" readonly/></label>
    <ul class="messages-rail__list">
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">★ Stripe</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row messages-rail__row--unread"><span class="messages-rail__avatar">MK</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Morgan Kim</span><span class="messages-rail__time">Today</span></span><span class="messages-rail__preview">referral · referral intro</span><span class="messages-rail__meta"><span class="messages-rail__touch">referral · referral intro · Today</span></span></span></button></li>
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">SP</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Sam Patel</span><span class="messages-rail__time">Wed</span></span><span class="messages-rail__preview">hiring EM · eng leader note</span><span class="messages-rail__meta"><span class="messages-rail__touch">hiring EM · eng leader note · Wed</span></span></span></button></li>
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">RC</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Riley Chen</span><span class="messages-rail__time">Next week</span></span><span class="messages-rail__preview">recruiter · recruiter note</span><span class="messages-rail__meta"><span class="messages-rail__touch">recruiter · recruiter note · Next week</span></span></span></button></li>
        </ul>
      </li>
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">Notion</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">AJ</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Avery Jones</span><span class="messages-rail__time">Fri</span></span><span class="messages-rail__preview">referral · referral intro</span><span class="messages-rail__meta"><span class="messages-rail__touch">referral · referral intro · Fri</span></span></span></button></li>
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">CW</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Casey Wu</span><span class="messages-rail__time">Oct 7</span></span><span class="messages-rail__preview">hiring EM · follow-up</span><span class="messages-rail__meta"><span class="messages-rail__touch">hiring EM · follow-up · Oct 7</span></span></span></button></li>
        </ul>
      </li>
    </ul>
  </nav>
</aside>
<main class="stage">
  <section class="messages-pane">
    <header class="messages-pane__top">
      <div class="messages-pane__heading"><h2 class="messages-pane__title"><span>Messages</span></h2></div>
    </header>
    <div class="messages-pane__body">
      <p class="messages-pane__empty">Pick a person. The inbox shows company priority, role, next step, and due.</p>
    </div>
  </section>
</main>
</body></html>
