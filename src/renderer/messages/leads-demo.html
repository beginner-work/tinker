<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leads demo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/design-tokens.css" />
  <link rel="stylesheet" href="/leads/" />
  <style>
    html, body.leads-page { height: auto; min-height: 100vh; overflow: auto; display: block; background: var(--color-background); }
    .leads { max-width: 52rem; margin: 0 auto; padding: 40px 20px 80px; }
    .leads__nav { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; font-size: 13px; }
    .leads__nav a { color: var(--color-muted); text-decoration: none; }
    .leads__title { margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 650; letter-spacing: -0.02em; }
    .leads__lede { margin: 8px 0 12px; color: var(--color-muted); font-size: 15px; line-height: 1.5; }
    .leads__drafts { margin: 0 0 20px; font-size: 14px; }
    .leads__drafts a { color: var(--color-accent-strong); }
    .leads__toolbar, .leads__form, .leads__stage { margin: 0 0 28px; padding: 16px 0 20px; background: transparent; border: 0; border-top: 1px solid var(--color-border); border-radius: 0; }
    .leads__toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    .leads__field { display: flex; flex-direction: column; gap: 4px; min-width: 8rem; flex: 1; }
    .leads__field label, .leads__heading { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-muted); }
    .leads__input, .leads__select { min-height: 38px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--color-border); border-radius: 0; background: transparent; font: inherit; font-size: 14px; }
    .leads__button { padding: 8px 12px; border-radius: 0; background: transparent; color: var(--color-foreground); font-size: 13px; font-weight: 600; border: 0; border-bottom: 2px solid var(--color-accent-strong); }
    .leads__button--quiet { border-bottom-color: var(--color-border); font-weight: 500; }
    .leads__heading { margin: 0 0 10px; }
    .leads__list { list-style: none; margin: 0; padding: 0; }
    .leads__row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--color-border); background: transparent; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .leads__name { margin: 0; font-size: 15px; font-weight: 600; }
    .leads__meta { margin: 2px 0 0; color: var(--color-muted); font-size: 13px; }
  </style>
</head>
<body class="leads-page">
  <main class="leads">
    <nav class="leads__nav"><a href="/">Messages</a><a href="/leads" aria-current="page">Leads</a><a href="/career">Career</a></nav>
    <h1 class="leads__title">Leads</h1>
    <p class="leads__lede">Keep every lead in one place. Filter by stage or company, add one, or paste a list. Tinker never sends a message for you.</p>
    <p class="leads__drafts"><a href="/">Draft messages live in Messages</a></p>
    <section class="leads__toolbar">
      <div class="leads__field"><label>Stage</label><select class="leads__select"><option>All stages</option><option>drafting</option></select></div>
      <div class="leads__field"><label>Company</label><input class="leads__input" value="Northwind Labs" /></div>
      <button class="leads__button" type="button">Apply</button>
      <button class="leads__button leads__button--quiet" type="button">Clear</button>
    </section>
    <section class="leads__stage">
      <h2 class="leads__heading">Drafting</h2>
      <ul class="leads__list">
        <li><button type="button" class="leads__row"><span><p class="leads__name">Alex Rivera</p><p class="leads__meta">Eng Manager · Northwind Labs · hiring leader</p></span><span class="leads__meta">drafting</span></button></li>
        <li><button type="button" class="leads__row"><span><p class="leads__name">Sam Okonkwo</p><p class="leads__meta">Recruiter · Northwind Labs · recruiter</p></span><span class="leads__meta">contacted</span></button></li>
      </ul>
    </section>
    <section class="leads__stage">
      <h2 class="leads__heading">New</h2>
      <ul class="leads__list">
        <li><button type="button" class="leads__row"><span><p class="leads__name">Jordan Lee</p><p class="leads__meta">Staff Engineer · Bright Harbor · referrer</p></span><span class="leads__meta">new</span></button></li>
      </ul>
    </section>
  </main>
</body>
</html>
