<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Inbox chrome demo</title>
<link rel="stylesheet" href="/styles.css"/>
<link rel="stylesheet" href="/design-tokens.css"/>
<link rel="stylesheet" href="/mobile-drawer.css"/>
<style>
  html, body { height: 100%; margin: 0; }
  /* Simulate iPhone home-indicator safe area for desktop screenshots. */
  body.demo-iphone .sidebar {
    padding-bottom: 34px !important;
  }
</style>
</head>
<body class="messages-shell-open messages-inbox-primary demo-iphone">
<button id="drawer-toggle" class="drawer-toggle" type="button" aria-label="Open sidebar" hidden></button>
<div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>
<aside class="sidebar sidebar--inbox" id="sidebar">
  <header class="sidebar__top">
    <button class="sidebar__brand" type="button" id="nav-home">
      <span class="sidebar__name">tinker</span>
    </button>
  </header>
  <nav class="messages-rail" id="sidebar-messages" aria-label="Conversations">
    <div class="messages-rail__head"><span class="messages-rail__title">Inbox</span></div>
    <div class="messages-rail__you">
      <button type="button" class="messages-rail__row messages-rail__row--you" data-open="you">
        <span class="messages-rail__logo" aria-hidden="true"></span>
        <span class="messages-rail__main">
          <span class="messages-rail__top"><span class="messages-rail__name">You</span></span>
          <span class="messages-rail__preview">Keep crafting</span>
        </span>
      </button>
    </div>
    <ul class="messages-rail__list">
      <li>
        <button type="button" class="messages-rail__row messages-rail__row--reading messages-rail__row--unread" data-open="reading">
          <span class="messages-rail__logo messages-rail__logo--book" aria-hidden="true"><svg class="messages-rail__book" viewBox="0 0 24 24" width="14" height="14" focusable="false"><path fill="currentColor" d="M6.5 3.75A2.25 2.25 0 0 0 4.25 6v12A2.25 2.25 0 0 0 6.5 20.25h12.25a.75.75 0 0 0 0-1.5H6.5a.75.75 0 0 1-.75-.75V6A.75.75 0 0 1 6.5 5.25h11.5v12.5a.75.75 0 0 0 1.5 0V4.5A.75.75 0 0 0 18.75 3.75H6.5Z"/></svg></span>
          <span class="messages-rail__main">
            <span class="messages-rail__top"><span class="messages-rail__name">Example Book</span></span>
            <span class="messages-rail__preview">Part I · Chapter 1</span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="messages-rail__row" data-open="malay">
          <span class="messages-rail__logo" aria-hidden="true"></span>
          <span class="messages-rail__main">
            <span class="messages-rail__top"><span class="messages-rail__name">Malay</span><span class="messages-rail__time">Today</span></span>
            <span class="messages-rail__preview">Recruiter, MK Network</span>
            <span class="messages-rail__meta"><span class="messages-rail__touch">interview prep</span></span>
          </span>
        </button>
      </li>
    </ul>
  </nav>
  <footer class="sidebar__footer sidebar__footer--gear">
    <a class="messages-rail__settings" href="/settings" aria-label="Settings">
      <svg class="messages-rail__settings-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="messages-rail__settings-label">Settings</span>
    </a>
  </footer>
</aside>
<main class="stage" id="stage">
  <section id="messages-pane" class="messages-pane" aria-label="Conversation">
    <header class="messages-pane__top">
      <div class="messages-pane__lead" data-messages-lead>
        <button type="button" class="messages-pane__back" data-messages-back aria-label="Back to conversations">←</button>
        <span class="messages-pane__avatar" data-messages-avatar hidden aria-hidden="true"></span>
        <h2 class="messages-pane__title">
          <span class="messages-pane__name" data-messages-name>Messages</span>
          <span class="messages-pane__role" data-messages-role hidden></span>
        </h2>
      </div>
      <div class="messages-pane__links" data-messages-links hidden></div>
    </header>
    <div class="messages-pane__body">
      <div class="messages-pane__thread messages-thread" data-messages-thread>
        <div class="messages-notepad">
          <div class="messages-notepad__opening">
            <h2 class="messages-notepad__question">Tell me about yourself. Why the Destinations team at Hightouch?</h2>
          </div>
          <textarea class="messages-notepad__input" rows="4" placeholder="Write your answer…"></textarea>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="/mobile-drawer.js"></script>
<script>
  function openThread(name, role, postingUrl) {
    document.body.classList.add("messages-mobile-thread", "messages-thread-active");
    document.querySelector("[data-messages-name]").textContent = name;
    var roleEl = document.querySelector("[data-messages-role]");
    roleEl.hidden = !role;
    roleEl.textContent = role || "";
    var host = document.querySelector("[data-messages-links]");
    host.innerHTML = "";
    if (postingUrl) {
      var a = document.createElement("a");
      a.className = "messages-pane__link messages-pane__link--posting";
      a.href = postingUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", "Job posting");
      a.title = "Job posting";
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>';
      host.appendChild(a);
      host.hidden = false;
    } else {
      host.hidden = true;
    }
  }
  document.querySelectorAll("[data-open]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var kind = btn.getAttribute("data-open");
      if (kind === "malay") openThread("Malay", "Recruiter, MK Network at Hightouch", "https://air.usebraintrust.com/i/379/8200");
      else if (kind === "reading") openThread("Example Book", "Part I · Chapter 1", "");
      else openThread("You", "", "");
    });
  });
  document.querySelector("[data-messages-back]").addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    document.body.classList.remove("messages-mobile-thread", "messages-thread-active");
    if (window.tinkerMobileDrawer) window.tinkerMobileDrawer.close();
  });
  // Demo helpers for automated checks.
  window.__demoOpen = openThread;
  window.__demoBack = function () {
    document.body.classList.remove("messages-mobile-thread", "messages-thread-active");
  };
</script>
</body>
</html>
