<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Company inbox mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/design-tokens.css"/><link rel="stylesheet" href="/mobile-drawer.css"/>
<style>html,body{height:100%;margin:0}</style>
</head>
<body class="messages-shell-open messages-inbox-primary">
<aside class="sidebar sidebar--inbox" id="sidebar-messages">
  <header class="sidebar__top"><button class="sidebar__brand" type="button"><span class="sidebar__name">tinker</span></button></header>
  <nav class="messages-rail">
    <div class="messages-rail__head"><span class="messages-rail__title">Inbox</span></div>
    <div class="messages-rail__you">
      <button type="button" class="messages-rail__row messages-rail__row--you"><span class="messages-rail__avatar messages-avatar--photo messages-avatar--brand"><img class="messages-avatar__img" src="/icons/lindow-labs.svg" alt=""/></span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Lindow Labs</span></span><span class="messages-rail__preview">Tyler Lindow</span></span></button>
    </div>
    <label class="messages-rail__search"><input class="messages-rail__search-input" placeholder="Search people or companies" readonly/></label>
    <ul class="messages-rail__list">
      <li><button type="button" class="messages-rail__row" data-open-company><span class="messages-rail__avatar">ST</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">★ Stripe</span><span class="messages-rail__time">3</span></span><span class="messages-rail__preview">referral · referral intro · Today</span></span></button></li>
      <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">NO</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Notion</span><span class="messages-rail__time">2</span></span><span class="messages-rail__preview">hiring EM · eng leader note</span></span></button></li>
    </ul>
  </nav>
</aside>
<main class="stage">
  <section class="messages-pane" id="messages-pane">
    <header class="messages-pane__top">
      <button type="button" class="messages-pane__back" data-messages-back aria-label="Back">←</button>
      <span class="messages-pane__avatar" aria-hidden="true">ST</span>
      <div class="messages-pane__heading"><h2 class="messages-pane__title"><span>Stripe</span><span class="messages-pane__role"> · North Star</span></h2></div>
    </header>
    <div class="messages-pane__tabs" data-messages-tabs>
      <button type="button" class="messages-pane__tab messages-pane__tab--on"><span class="messages-pane__tab-name">Morgan Kim</span><span class="messages-pane__tab-meta">referral · referral intro · Today</span></button>
      <button type="button" class="messages-pane__tab"><span class="messages-pane__tab-name">Sam Patel</span><span class="messages-pane__tab-meta">hiring EM · eng leader note · Wed</span></button>
      <button type="button" class="messages-pane__tab"><span class="messages-pane__tab-name">Riley Chen</span><span class="messages-pane__tab-meta">recruiter · recruiter note</span></button>
    </div>
    <div class="messages-pane__body">
      <div class="messages-pane__thread messages-thread">
        <ol class="messages-thread__list">
          <li class="messages-thread__item messages-thread__item--owner messages-thread__item--draft">
            <button type="button" class="messages-thread__bubble">
              <div class="messages-thread__subject">Quick intro</div>
              <div class="messages-thread__body">Following up with Morgan.</div>
              <div class="messages-thread__meta">Draft · LinkedIn DM · Today</div>
            </button>
          </li>
        </ol>
      </div>
    </div>
  </section>
</main>
<script>
  document.querySelector("[data-open-company]").addEventListener("click", function () {
    document.body.classList.add("messages-mobile-thread", "messages-thread-active");
  });
  document.querySelector("[data-messages-back]").addEventListener("click", function () {
    document.body.classList.remove("messages-mobile-thread", "messages-thread-active");
  });
</script>
</body></html>
