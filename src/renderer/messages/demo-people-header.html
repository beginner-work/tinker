<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>People inbox — profile links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/design-tokens.css"/><link rel="stylesheet" href="/mobile-drawer.css"/>
</head>
<body class="messages-shell-open messages-inbox-primary messages-thread-active">
<aside class="sidebar sidebar--inbox" style="padding-top:14px">
  <header class="sidebar__top"><button class="sidebar__brand" type="button"><span class="sidebar__name">tinker</span></button></header>
  <nav class="messages-rail">
    <div class="messages-rail__head"><span class="messages-rail__title">Inbox</span></div>
    <div class="messages-rail__you">
      <button type="button" class="messages-rail__row messages-rail__row--you">
        <span class="messages-rail__avatar messages-avatar--photo messages-avatar--brand" aria-hidden="true"><img class="messages-avatar__img" src="/icons/lindow-labs.svg" alt=""/></span>
        <span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Tyler Lindow</span></span><span class="messages-rail__preview">Founder at Lindow Labs</span></span>
      </button>
    </div>
    <ul class="messages-rail__list">
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">THIS WEEK</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row" aria-current="true"><span class="messages-rail__avatar messages-avatar--photo" aria-hidden="true"><img class="messages-avatar__img" src="https://icons.duckduckgo.com/ip3/stripe.com.ico" alt=""/></span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Morgan Kim</span><span class="messages-rail__time">Tue</span></span><span class="messages-rail__preview">Stripe · referral intro</span></span></button></li>
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar messages-avatar--photo" aria-hidden="true"><img class="messages-avatar__img" src="https://icons.duckduckgo.com/ip3/notion.so.ico" alt=""/></span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Jordan Lee</span><span class="messages-rail__time">Thu</span></span><span class="messages-rail__preview">Notion · eng leader note</span></span></button></li>
        </ul>
      </li>
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">LATER</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar messages-avatar--photo" aria-hidden="true"><img class="messages-avatar__img" src="https://icons.duckduckgo.com/ip3/anthropic.com.ico" alt=""/></span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Alex Rivera</span></span><span class="messages-rail__preview">Anthropic · no due date</span></span></button></li>
        </ul>
      </li>
    </ul>
  </nav>
  <footer class="sidebar__footer sidebar__footer--gear">
    <a class="messages-rail__settings" href="/settings" aria-label="Settings">
      <svg class="messages-rail__settings-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span>Settings</span>
    </a>
  </footer>
</aside>
<main class="stage">
  <section class="messages-pane">
    <header class="messages-pane__top">
      <span class="messages-pane__avatar messages-avatar--photo" aria-hidden="true"><img class="messages-avatar__img" src="https://icons.duckduckgo.com/ip3/stripe.com.ico" alt=""/></span>
      <div class="messages-pane__heading">
        <h2 class="messages-pane__title"><span data-messages-name>Morgan Kim</span><span class="messages-pane__role" data-messages-role> · Eng manager at Stripe</span></h2>
        <div class="messages-pane__links" data-messages-links>
          <a class="messages-pane__link messages-pane__link--linkedin" href="https://www.linkedin.com/in/morgan-kim-test" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
          <a class="messages-pane__link messages-pane__link--github" href="https://github.com/morgan-kim" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.05-.02-2.06-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.66-.3-5.46-1.33-5.46-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.89-.01 3.28 0 .32.21.7.82.58A12.01 12.01 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/></svg></a>
        </div>
      </div>
    </header>
    <div class="messages-pane__body">
      <div class="messages-pane__thread messages-thread" data-messages-thread>
        <div class="messages-notepad" data-messages-notepad="1">
          <div class="messages-notepad__body">
            <div class="messages-notepad__card">
              <div class="messages-notepad__meta">
                <div class="messages-notepad__opening">
                  <span class="messages-notepad__mark" aria-hidden="true"><img class="messages-notepad__mark-img" src="https://icons.duckduckgo.com/ip3/stripe.com.ico" alt="" width="18" height="18"/></span>
                  <p class="messages-notepad__context"><em>Drafting for Morgan Kim at Stripe.</em></p>
                  <h2 class="messages-notepad__question">What do you want Morgan Kim at Stripe to understand about you?</h2>
                </div>
              </div>
              <textarea class="messages-notepad__input" aria-label="Your note"></textarea>
            </div>
          </div>
          <footer class="messages-notepad__foot">
            <button type="button" class="messages-notepad__secondary">Keep crafting</button>
            <button type="button" class="messages-notepad__primary">This is everything</button>
          </footer>
        </div>
      </div>
    </div>
  </section>
</main>
</body></html>
