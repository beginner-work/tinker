<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inbox — polish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/design-tokens.css"/>
</head>
<body class="messages-shell-open messages-inbox-primary messages-thread-active">
<aside class="sidebar sidebar--inbox" style="padding-top:14px">
  <header class="sidebar__top"><button class="sidebar__brand" type="button"><span class="sidebar__name">tinker</span></button></header>
  <nav class="messages-rail">
    <div class="messages-rail__head"><span class="messages-rail__title">Inbox</span><span class="messages-rail__badge">1</span></div>
    <div class="messages-rail__you"><button type="button" class="messages-rail__row messages-rail__row--you"><span class="messages-rail__avatar">TY</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Tyler Lindow</span></span></span></button></div>
    <label class="messages-rail__search"><input class="messages-rail__search-input" placeholder="Search people or companies" readonly/></label>
    <ul class="messages-rail__list">
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">Today</span><span class="messages-rail__group-count">1</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row messages-rail__row--unread" aria-current="true"><span class="messages-rail__avatar">AR</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Alex Rivera</span><span class="messages-rail__time">Tue, Sep 29</span></span><span class="messages-rail__preview">Following up on the platform role</span><span class="messages-rail__meta"><span class="messages-rail__touch">eng leader note</span></span></span><span class="messages-rail__unread">1</span></button></li>
        </ul>
      </li>
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">This week</span><span class="messages-rail__group-count">1</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">JK</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Jordan Kim</span><span class="messages-rail__time">Fri, Oct 2</span></span><span class="messages-rail__preview">Thanks for the intro note</span><span class="messages-rail__meta"><span class="messages-rail__touch">recruiter note</span></span></span></button></li>
        </ul>
      </li>
      <li class="messages-rail__group">
        <button type="button" class="messages-rail__group-head" aria-expanded="true"><span class="messages-rail__group-label">No next touch</span><span class="messages-rail__group-count">1</span></button>
        <ul class="messages-rail__group-list">
          <li><button type="button" class="messages-rail__row"><span class="messages-rail__avatar">SL</span><span class="messages-rail__main"><span class="messages-rail__top"><span class="messages-rail__name">Sam Lee</span><span class="messages-rail__time">3d</span></span><span class="messages-rail__preview">No draft yet</span></span></button></li>
        </ul>
      </li>
    </ul>
  </nav>
  <nav class="sidebar__secondary">
    <a class="sidebar__secondary-link" href="/story-parts">Story parts</a>
    <a class="sidebar__secondary-link" href="/leads">Leads</a>
  </nav>
</aside>
<main class="stage">
  <section class="messages-pane">
    <header class="messages-pane__top">
      <div class="messages-pane__heading">
        <h2 class="messages-pane__title"><span data-messages-name>Alex Rivera</span><span class="messages-pane__role"> · Eng manager at Northwind Labs</span></h2>
      </div>
    </header>
    <div class="messages-pane__body"><div class="messages-pane__thread messages-thread"><ol class="messages-thread__list">
      <li class="messages-thread__item messages-thread__item--owner messages-thread__item--draft"><button type="button" class="messages-thread__bubble"><div class="messages-thread__subject">Following up</div><div class="messages-thread__body">Built from story parts.</div><div class="messages-thread__meta">Draft · Gmail · Sep 29, 2:10 PM</div></button></li>
      <li class="messages-thread__item messages-thread__item--owner messages-thread__item--scheduled"><div class="messages-thread__bubble messages-thread__bubble--scheduled"><div class="messages-thread__body">Next eng leader note planned. Write the draft below.</div><div class="messages-thread__meta">Scheduled · eng leader note · Gmail · Tue, Sep 29</div></div></li>
    </ol></div></div>
    <footer class="messages-composer">
      <div class="messages-composer__shell">
        <div class="messages-composer__chips">
          <button type="button" class="messages-composer__chip messages-composer__chip--on">hook · Built from story parts</button>
        </div>
        <div class="messages-composer__toolbar">
          <label class="messages-composer__chip-wrap"><select class="messages-composer__chip-select"><option>Gmail</option></select></label>
          <button type="button" class="messages-composer__chip-btn"><span>Sep 29</span></button>
        </div>
        <textarea class="messages-composer__textarea" rows="1">Built from story parts.</textarea>
        <div class="messages-composer__actions">
          <button type="button" class="messages-composer__next">Next</button>
          <button type="button" class="messages-composer__ship">Ship</button>
        </div>
      </div>
    </footer>
  </section>
</main>
</body></html>
