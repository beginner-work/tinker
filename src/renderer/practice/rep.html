<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self';" />
    <title>Practice rep</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/practice/practice.css" />
  </head>
  <body class="practice-page practice-page--rep">
    <!-- Mirrors #writing in index.html: progress, stage card, foot actions. -->
    <section class="writing practice-writing" id="practice-writing">
      <header class="writing__top">
        <a href="/practice" class="writing__close" id="practice-close" aria-label="Close — back to Practice">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </a>
        <div id="practice-progress" class="writing__progress" aria-hidden="true"></div>
        <div class="writing__step" id="practice-step">Code</div>
        <p class="practice-writing__streak" id="practice-streak" aria-live="polite">Streak: 0 weekdays</p>
      </header>

      <div class="writing__body">
        <div id="practice-stage" class="writing__stage" role="main"></div>
      </div>

      <footer class="writing__foot" data-thread-actions="1">
        <button id="practice-secondary" class="writing__end" type="button">Unlock hint</button>
        <button id="practice-primary" class="writing__next" type="button">Run tests →</button>
      </footer>
    </section>

    <script src="/practice/streak.js"></script>
    <script src="/practice/reps/pacific-wall-time.js"></script>
    <script src="/practice/reps/mark-touch-sent.js"></script>
    <script src="/practice/reps/stripe-payment-intent.js"></script>
    <script src="/practice/catalog.js"></script>
    <script src="/practice/runner.js"></script>
    <script src="/practice/rep.js"></script>
  </body>
</html>
