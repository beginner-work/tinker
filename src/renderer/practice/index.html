<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self';" />
    <title>Practice</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/practice/practice.css" />
  </head>
  <body class="practice-page">
    <!-- Same shell language as #writing: top chrome, centered stage, quiet list of prompts. -->
    <section class="writing practice-writing practice-writing--list" id="practice-writing">
      <header class="writing__top">
        <a href="/" class="writing__close" aria-label="Back to Messages">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </a>
        <div class="writing__progress" aria-hidden="true"></div>
        <div class="writing__step">Practice</div>
        <p class="practice-writing__streak" id="practice-streak" aria-live="polite">Streak: 0 weekdays</p>
      </header>

      <div class="writing__body">
        <div class="writing__stage">
          <div class="writing-card">
            <h1 class="writing-question">What are you practicing?</h1>
            <p class="writing-note">A 45-minute weekday morning rep. Spec, starter, tests, and hints — no solution and no AI that writes code. Progress stays on this device.</p>
            <ul class="practice-list" id="practice-list"></ul>
          </div>
        </div>
      </div>
    </section>

    <script src="/practice/streak.js"></script>
    <script src="/practice/reps/pacific-wall-time.js"></script>
    <script src="/practice/reps/mark-touch-sent.js"></script>
    <script src="/practice/reps/stripe-payment-intent.js"></script>
    <script src="/practice/catalog.js"></script>
    <script src="/practice/practice.js"></script>
  </body>
</html>
