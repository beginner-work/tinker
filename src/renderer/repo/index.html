<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fffdf7" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self';" />
    <title>tinker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=6" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/repo/repo.css?v=6" />
  </head>
  <body class="repo-page">
    <header class="repo-top" aria-label="Repository">
      <a class="repo-top__back" href="/?write=1">Write</a>
      <p class="repo-top__name" id="repo-name">tinker</p>
      <p class="repo-top__branch" id="repo-branch">stories</p>

      <div class="repo-location" id="repo-location">
        <img class="repo-location__logo" src="/icons/tinker-mark.svg" alt="" aria-hidden="true" width="20" height="20" />
        <span class="repo-location__caption" id="repo-location-caption">Location</span>
        <button type="button" class="repo-location__btn" id="repo-location-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="repo-location-panel" aria-labelledby="repo-location-caption repo-location-value">
          <span class="repo-location__value" id="repo-location-value">tinker</span>
          <svg class="repo-location__chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="repo-location__panel" id="repo-location-panel" hidden>
          <ul class="repo-location__list" id="repo-location-list" role="listbox" tabindex="-1" aria-labelledby="repo-location-caption"></ul>
          <div class="repo-location__custom" id="repo-location-custom" hidden>
            <label class="repo-location__label" for="repo-location-input">Custom location</label>
            <input type="text" class="repo-location__input" id="repo-location-input" placeholder="reflections/2026/october" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" />
            <p class="repo-location__hint" id="repo-location-hint">Type a folder path. Missing folders are created.</p>
            <p class="repo-location__error" id="repo-location-error" role="alert" hidden></p>
            <div class="repo-location__actions">
              <button type="button" class="repo-location__save" id="repo-location-save">Save</button>
            </div>
          </div>
          <button type="button" class="repo-location__choose" id="repo-location-choose" hidden>Mac folder…</button>
        </div>
      </div>

      <div class="repo-top__actions" id="repo-download-actions">
        <button type="button" class="repo-top__action" id="repo-download-one" hidden>Download</button>
        <button type="button" class="repo-top__action" id="repo-download-all" hidden>Download all</button>
      </div>
    </header>

    <div class="repo-layout">
      <aside class="repo-sidebar" aria-label="Files">
        <section class="repo-tree" aria-labelledby="repo-stories-heading">
          <div class="repo-tree__head">
            <h2 class="repo-sidebar__heading" id="repo-stories-heading">Files</h2>
            <div class="repo-tree__actions">
              <button type="button" class="repo-tree__new" id="repo-new-folder">New folder</button>
              <button type="button" class="repo-tree__new" id="repo-new-piece">New file</button>
            </div>
          </div>
          <div class="repo-tree__body" id="repo-tree" role="tree"></div>
          <p class="repo-changes__empty" id="repo-stories-empty" hidden>No files yet.</p>
        </section>
      </aside>

      <main class="repo-center" aria-label="Writing">
        <div class="repo-surface writing" id="repo-surface">
          <textarea class="writing-input repo-surface__input" id="repo-body" spellcheck="true"></textarea>
        </div>
      </main>

      <aside class="repo-right" aria-label="File">
        <section class="repo-changes" aria-labelledby="repo-file-heading">
          <h2 class="repo-sidebar__heading" id="repo-file-heading">File</h2>
          <p class="repo-file__path" id="repo-file-path"></p>
          <p class="repo-file__type" id="repo-file-type" hidden></p>
          <p class="repo-changes__hint" id="repo-sync-hint" hidden></p>
        </section>
      </aside>
    </div>

    <div class="repo-sheet" id="repo-move-sheet" hidden>
      <div class="repo-sheet__backdrop" id="repo-move-backdrop"></div>
      <div class="repo-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="repo-move-title">
        <h2 class="repo-sheet__title" id="repo-move-title">Move to</h2>
        <p class="repo-sheet__hint" id="repo-move-hint">Choose a folder</p>
        <div class="repo-sheet__list" id="repo-move-list"></div>
        <button type="button" class="repo-sheet__cancel" id="repo-move-cancel">Cancel</button>
      </div>
    </div>

    <div class="repo-sheet" id="repo-confirm-sheet" hidden>
      <div class="repo-sheet__backdrop" id="repo-confirm-backdrop"></div>
      <div class="repo-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="repo-confirm-title">
        <h2 class="repo-sheet__title" id="repo-confirm-title">Delete folder?</h2>
        <p class="repo-sheet__hint" id="repo-confirm-hint"></p>
        <div class="repo-sheet__actions">
          <button type="button" class="repo-sheet__primary" id="repo-confirm-keep">Move files to parent</button>
          <button type="button" class="repo-sheet__danger" id="repo-confirm-delete">Delete folder tree</button>
          <button type="button" class="repo-sheet__cancel" id="repo-confirm-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <script src="/lib/stories-md.js?v=6"></script>
    <script src="/lib/repo-folders-core.js?v=6"></script>
    <script src="/repo/repo.js?v=6"></script>
  </body>
</html>
