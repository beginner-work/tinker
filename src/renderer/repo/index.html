<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fffdf7" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self';" />
    <title>tinker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=9" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/repo/repo.css?v=9" />
  </head>
  <body class="repo-page repo-page--write" data-repo-mode="write">
    <header class="repo-top" aria-label="Repository">
      <a class="repo-top__back" href="/?write=1">Home</a>
      <p class="repo-top__name" id="repo-name">tinker</p>
      <a class="repo-top__nav" id="repo-files-link" href="/repo/files">Files</a>

      <div class="repo-location" id="repo-location">
        <svg class="repo-location__globe" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <ellipse cx="10" cy="10" rx="3.2" ry="7.25" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <path d="M3 10h14M4.2 6.5h11.6M4.2 13.5h11.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span class="repo-location__caption" id="repo-location-caption">Location</span>
        <div class="repo-location__field">
          <input type="text" class="repo-location__input writing-input" id="repo-location-input" placeholder="Where are you?" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-autocomplete="list" aria-controls="repo-location-panel" aria-expanded="false" aria-labelledby="repo-location-caption" maxlength="120" />
          <button type="button" class="repo-location__btn" id="repo-location-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="repo-location-panel" aria-label="Suggested places">
            <svg class="repo-location__chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="repo-location__panel" id="repo-location-panel" hidden>
          <ul class="repo-location__list" id="repo-location-list" role="listbox" tabindex="-1" aria-labelledby="repo-location-caption"></ul>
        </div>
      </div>

      <div class="repo-top__actions" id="repo-download-actions">
        <button type="button" class="repo-top__action" id="repo-new-piece">New file</button>
        <button type="button" class="repo-top__action" id="repo-download-one" hidden>Download</button>
        <button type="button" class="repo-top__action" id="repo-download-all" hidden>Download all</button>
      </div>
    </header>

    <div class="repo-layout repo-layout--write">
      <main class="repo-center" aria-label="Pad">
        <div class="repo-surface writing" id="repo-surface">
          <textarea class="writing-input repo-surface__input" id="repo-body" spellcheck="true"></textarea>
        </div>
      </main>

      <aside class="repo-right" aria-label="File">
        <section class="repo-changes" aria-labelledby="repo-file-heading">
          <h2 class="repo-sidebar__heading" id="repo-file-heading">File</h2>
          <p class="repo-file__path" id="repo-file-path"></p>
          <p class="repo-file__type" id="repo-file-type" hidden></p>
          <p class="repo-file__place" id="repo-file-place" hidden></p>
          <p class="repo-changes__hint" id="repo-sync-hint" hidden></p>
        </section>
      </aside>
    </div>

    <!-- Legacy ids kept hidden for test/id stability; storage UI lives on Files. -->
    <button type="button" class="repo-location__choose" id="repo-location-choose" hidden>Mac folder…</button>
    <div id="repo-location-custom" hidden></div>
    <p id="repo-location-error" hidden></p>
    <span id="repo-location-value" hidden></span>
    <button type="button" id="repo-location-save" hidden>Save</button>

    <script src="/lib/stories-md.js?v=9"></script>
    <script src="/lib/repo-folders-core.js?v=9"></script>
    <script src="/lib/storage-path-core.js?v=9"></script>
    <script src="/lib/fs-access-folder.js?v=9"></script>
    <script src="/lib/storage-adapters.js?v=9"></script>
    <script src="/repo/repo.js?v=9"></script>
    <script src="/repo/storage-section.js?v=9"></script>
  </body>
</html>
