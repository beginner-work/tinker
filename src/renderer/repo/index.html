<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fffdf7" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://lindowlabs.dev; script-src 'self'; frame-src https://lindowlabs.dev;" />
    <title>tinker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=40" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/repo/repo.css?v=64" />
  </head>
  <body class="repo-page repo-page--write" data-repo-mode="write">
    <!-- Shared top bar: Tinker mark (Technical) + hamburger (Business).
         Continuous with the writing surface - no distinct nav chrome.
         One writing flow; Haiku classifies into left/right lists. -->
    <header class="repo-top repo-top--labs" aria-label="Tools">
      <button type="button"
         class="repo-top__labs"
         id="repo-labs-link"
         aria-label="Technical essays"
         title="Technical essays"
         aria-expanded="false"
         aria-controls="repo-left"
         data-technical-essays-nav>
        <!-- Canonical tinker mark; same 20px box as the hamburger. -->
        <img class="repo-top__labs-icon" src="/icons/tinker-mark.svg?v=40" alt="" width="20" height="20" aria-hidden="true" />
      </button>
      <button type="button" class="repo-top__past-essays" id="repo-past-essays"
              aria-label="Business essays" title="Business essays" aria-expanded="false"
              aria-controls="repo-right">
        <!-- Lucide Menu (hamburger); same 20px box + stroke weight as before. -->
        <svg class="repo-top__past-essays-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                d="M4 5h16M4 12h16M4 19h16"/>
        </svg>
      </button>
    </header>

    <div class="repo-layout repo-layout--write" id="repo-layout">
      <!-- Left Technical essays sidebar. Toggled by the tinker mark. -->
      <aside class="repo-left repo-tech-essays-sidebar" id="repo-left" aria-label="Technical essays" hidden>
        <header class="repo-panel__head" id="repo-tech-panel-head">
          <div class="repo-panel__head-row repo-panel__head-row--title">
            <h2 class="repo-panel__title" id="repo-tech-heading">Technical essays</h2>
          </div>
        </header>
        <section class="repo-tree" aria-labelledby="repo-tech-heading">
          <div class="repo-tree__head repo-tree__head--mobile">
            <h2 class="repo-sidebar__heading">Technical essays</h2>
          </div>
          <div class="repo-tree__body" id="repo-tech-tree" role="tree"></div>
          <p class="repo-changes__empty" id="repo-tech-empty" hidden>No technical essays yet.</p>
        </section>
        <section class="repo-changes" aria-labelledby="repo-tech-file-heading">
          <h2 class="repo-sidebar__heading" id="repo-tech-file-heading">Essay</h2>
          <p class="repo-file__path" id="repo-tech-file-path"></p>
        </section>
      </aside>

      <div class="repo-ide-center" id="repo-ide-center">
        <!-- Writing surface. Mobile first screen stays here. -->
        <section class="repo-panel repo-panel--write" id="repo-panel" aria-label="Writing">
          <div class="repo-panel__body repo-panel__body--write" id="repo-panel-body">
            <div class="repo-panel__write" id="repo-panel-write">
              <div class="repo-surface writing repo-write-safe-top" id="repo-surface">
                <div class="repo-location" id="repo-location">
                  <div class="repo-location__field">
                    <img class="repo-location__globe" src="/icons/tinker-mark.svg?v=40" alt="" width="14" height="14" aria-hidden="true" />
                    <span class="visually-hidden" id="repo-location-caption">Location</span>
                    <input type="text" class="repo-location__input writing-input" id="repo-location-input" placeholder="Where are you?" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-autocomplete="list" aria-controls="repo-location-panel" aria-expanded="false" aria-labelledby="repo-location-caption" maxlength="120" />
                    <button type="button" class="repo-location__btn" id="repo-location-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="repo-location-panel" aria-label="Suggested places">
                      <svg class="repo-location__chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                  </div>
                  <div class="repo-location__panel" id="repo-location-panel" hidden>
                    <ul class="repo-location__list" id="repo-location-list" role="listbox" tabindex="-1" aria-labelledby="repo-location-caption"></ul>
                  </div>
                </div>
                <div class="repo-write-empty" id="repo-write-empty" hidden>
                  <p class="repo-write-empty__title">Pick a place to begin</p>
                  <p class="repo-write-empty__copy">Choose where you are above, then write.</p>
                </div>
                <p class="repo-followup" id="repo-followup" hidden></p>
                <div class="repo-essay-view" id="repo-essay-view" hidden aria-label="Essay"></div>
                <div class="repo-pad" id="repo-pad"></div>
                <textarea class="repo-pad__mirror" id="repo-body" spellcheck="true" aria-label="Writing" tabindex="-1"></textarea>
                <div class="repo-pad-error" id="repo-pad-error" hidden role="alert">
                  <p class="repo-pad-error__text" id="repo-pad-error-text"></p>
                  <div class="repo-pad-error__actions">
                    <button type="button" class="repo-pad-error__retry" id="repo-pad-error-retry" hidden>Retry</button>
                    <button type="button" class="repo-pad-error__signin" id="repo-pad-error-signin" hidden>Sign in</button>
                  </div>
                </div>
              </div>
              <!-- Outside the scrolling surface so the bar never covers essay/question text. -->
              <footer class="repo-surface__foot" id="repo-pad-actions" data-thread-actions="1" aria-hidden="true">
                <button type="button" class="repo-surface__action repo-surface__action--secondary" id="repo-keep-crafting" tabindex="-1" aria-keyshortcuts="Meta+Enter Control+Enter">Keep crafting<span class="repo-surface__kbd" id="repo-keep-crafting-kbd" aria-hidden="true">⌘↵</span></button>
                <button type="button" class="repo-surface__action repo-surface__action--primary" id="repo-this-is-everything" tabindex="-1" disabled>This is everything</button>
              </footer>
            </div>
          </div>
        </section>
      </div>

      <!-- Right Business essays sidebar (desktop + mobile). Toggled by the hamburger. -->
      <aside class="repo-right repo-essays-sidebar" id="repo-right" aria-label="Business essays" hidden>
        <header class="repo-panel__head" id="repo-panel-head">
          <div class="repo-panel__head-row repo-panel__head-row--title">
            <h2 class="repo-panel__title" id="repo-stories-heading">Business</h2>
          </div>
        </header>
        <section class="repo-tree" aria-labelledby="repo-stories-heading">
          <div class="repo-tree__head repo-tree__head--mobile">
            <h2 class="repo-sidebar__heading">Business</h2>
          </div>
          <div class="repo-tree__body" id="repo-tree" role="tree"></div>
          <p class="repo-changes__empty" id="repo-stories-empty" hidden>No business essays yet.</p>
        </section>
        <section class="repo-changes" aria-labelledby="repo-file-heading">
          <h2 class="repo-sidebar__heading" id="repo-file-heading">Essay</h2>
          <p class="repo-file__path" id="repo-file-path"></p>
          <p class="repo-file__type" id="repo-file-type" hidden></p>
          <p class="repo-file__place" id="repo-file-place" hidden></p>
          <p class="repo-changes__hint" id="repo-sync-hint" hidden></p>
        </section>
      </aside>
    </div>

    <div class="repo-sheet" id="repo-move-sheet" hidden>
      <div class="repo-sheet__backdrop" id="repo-move-backdrop"></div>
      <div class="repo-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="repo-move-title">
        <h2 class="repo-sheet__title" id="repo-move-title">Move to</h2>
        <p class="repo-sheet__hint" id="repo-move-hint">Choose a folder</p>
        <div class="repo-sheet__list" id="repo-move-list"></div>
        <button type="button" class="repo-sheet__cancel" id="repo-move-cancel">Cancel</button>
      </div>
    </div>

    <div class="repo-sheet" id="repo-confirm-sheet" hidden>
      <div class="repo-sheet__backdrop" id="repo-confirm-backdrop"></div>
      <div class="repo-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="repo-confirm-title">
        <h2 class="repo-sheet__title" id="repo-confirm-title">Delete folder?</h2>
        <p class="repo-sheet__hint" id="repo-confirm-hint"></p>
        <div class="repo-sheet__actions">
          <button type="button" class="repo-sheet__primary" id="repo-confirm-keep">Move files to parent</button>
          <button type="button" class="repo-sheet__danger" id="repo-confirm-delete">Delete folder tree</button>
          <button type="button" class="repo-sheet__cancel" id="repo-confirm-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Legacy ids kept hidden for test/id stability; storage UI lives on Files. -->
    <button type="button" class="repo-location__choose" id="repo-location-choose" hidden>Mac folder…</button>
    <div id="repo-location-custom" hidden></div>
    <p id="repo-location-error" hidden></p>
    <span id="repo-location-value" hidden></span>
    <button type="button" id="repo-location-save" hidden>Save</button>
    <!-- Hidden ids retained for test harness / deep-link helpers. -->
    <p id="repo-name" hidden>tinker</p>
    <button type="button" id="repo-new-piece" hidden>New file</button>
    <!-- Legacy bottom-panel chrome removed from layout; ids retained hidden. -->
    <button type="button" class="repo-panel__collapse" id="repo-panel-collapse" hidden aria-hidden="true">⌄</button>
    <button type="button" class="repo-panel__expand" id="repo-panel-expand" hidden aria-hidden="true">Business ˄</button>
    <div class="repo-panel__resize" id="repo-panel-resize" hidden aria-hidden="true"></div>

    <script src="/platform-mobile.js?v=42"></script>
    <script src="/lib/claude-models.js?v=3"></script>
    <script src="/lib/claude-structured.js?v=2"></script>
    <script src="/lib/essay-classify.js?v=1"></script>
    <script src="/interview-prompt.js?v=41"></script>
    <script src="/vendor/markdown-it.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/lib/essay-read.js?v=1"></script>
    <script src="/lib/stories-md.js?v=40"></script>
    <script src="/lib/repo-folders-core.js?v=42"></script>
    <script src="/lib/repo-pad-reveal.js?v=40"></script>
    <script src="/lib/repo-write-scroll.js?v=49"></script>
    <script src="/lib/storage-path-core.js?v=40"></script>
    <script src="/lib/fs-access-folder.js?v=40"></script>
    <script src="/lib/storage-adapters.js?v=40"></script>
    <script src="/lib/lock-in.js?v=1"></script>
    <script src="/lib/lock-in-ui.js?v=1"></script>
    <script src="/made-by-lindow-labs.js?v=52"></script>
    <script src="/repo/repo.js?v=55"></script>
    <script src="/repo/storage-section.js?v=40"></script>
  </body>
</html>
