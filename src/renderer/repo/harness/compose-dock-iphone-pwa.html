<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex, nofollow" />
    <title>tinker - compose dock iPhone PWA geometry</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=40" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/repo/repo.css?v=72" />
    <style>
      /*
       * iPhone 15 standalone PWA harness (393×852).
       * Chromium has no real env(safe-area-*), so mirror notch + home indicator
       * via the production --repo-safe-* tokens the compose dock reads.
       */
      :root {
        --harness-safe-top: 59px;
        --harness-safe-right: 0px;
        --harness-safe-bottom: 34px;
        --harness-safe-left: 0px;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body.repo-page--write {
        --repo-safe-right: var(--harness-safe-right);
        --repo-safe-bottom: var(--harness-safe-bottom);
      }
      /* Status-bar / home-indicator chrome so screenshots match a real PWA. */
      .harness-safe-top,
      .harness-safe-bottom {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 100;
        pointer-events: none;
        background: rgba(45, 42, 38, 0.06);
      }
      .harness-safe-top { top: 0; height: var(--harness-safe-top); }
      .harness-safe-bottom { bottom: 0; height: var(--harness-safe-bottom); }
    </style>
  </head>
  <body class="repo-page repo-page--write" data-repo-mode="write" data-compose-dock-harness="iphone-pwa">
    <div class="harness-safe-top" aria-hidden="true"></div>
    <div class="harness-safe-bottom" aria-hidden="true"></div>

    <header class="repo-top repo-top--labs" aria-label="Tools">
      <button type="button"
         class="repo-top__labs"
         id="repo-labs-link"
         aria-label="Development"
         title="Development"
         data-technical-essays-nav>
        <img class="repo-top__labs-icon" src="/icons/tinker-mark.svg?v=40" alt="" width="20" height="20" aria-hidden="true" />
      </button>
      <button type="button" class="repo-top__past-essays" id="repo-past-essays"
              aria-label="Founder Source" title="Founder Source" aria-expanded="false"
              aria-controls="repo-right">
        <svg class="repo-top__past-essays-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                d="M4 5h16M4 12h16M4 19h16"/>
        </svg>
      </button>
    </header>

    <div class="repo-layout repo-layout--write" id="repo-layout">
      <div class="repo-ide-center" id="repo-ide-center">
        <main class="repo-center repo-write-safe-top" id="repo-editor-main" aria-label="Editor" hidden></main>
        <section class="repo-panel repo-panel--write" id="repo-panel" aria-label="Writing">
          <div class="repo-panel__body repo-panel__body--write" id="repo-panel-body">
            <div class="repo-panel__write" id="repo-panel-write">
              <div class="repo-surface writing repo-write-safe-top" id="repo-surface">
                <div class="repo-location" id="repo-location">
                  <div class="repo-location__field">
                    <img class="repo-location__globe" src="/icons/tinker-mark.svg?v=40" alt="" width="14" height="14" aria-hidden="true" />
                    <input type="text" class="repo-location__input writing-input" value="Home" readonly />
                  </div>
                </div>
                <div class="repo-pad" id="repo-pad">
                  <textarea class="writing-input repo-pad__turn" data-pad-turn="1" spellcheck="false" readonly></textarea>
                </div>
              </div>
              <!-- Island state (visible). Toggle via ?state=fab for the New essay button. -->
              <footer class="repo-surface__foot is-visible is-content-ready" id="repo-pad-actions" data-thread-actions="1" aria-hidden="false">
                <button type="button" class="repo-surface__action repo-surface__action--secondary" id="repo-keep-crafting">Keep crafting</button>
                <button type="button" class="repo-surface__action repo-surface__action--primary" id="repo-this-is-everything">This is everything</button>
              </footer>
            </div>
          </div>
        </section>
      </div>
    </div>

    <button type="button"
       class="repo-fab-new is-docked-away"
       id="repo-new-essay"
       aria-label="New essay"
       title="New essay">
      <svg class="repo-fab-new__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
              d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var state = params.get("state") || "island";
        var foot = document.getElementById("repo-pad-actions");
        var fab = document.getElementById("repo-new-essay");
        if (state === "fab") {
          foot.classList.remove("is-visible", "is-content-ready");
          foot.setAttribute("aria-hidden", "true");
          fab.classList.remove("is-docked-away");
        } else {
          foot.classList.add("is-visible", "is-content-ready");
          foot.setAttribute("aria-hidden", "false");
          fab.classList.add("is-docked-away");
        }
      })();
    </script>
  </body>
</html>
