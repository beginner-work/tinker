<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>tinker - Notion corner connect</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=40" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/repo/repo.css?v=73" />
  </head>
  <body class="repo-page repo-page--write" data-repo-mode="write" data-notion-corner-harness="1">
    <header class="repo-top repo-top--labs" aria-label="Tools">
      <button type="button"
         class="repo-top__labs"
         id="repo-labs-link"
         aria-label="Development"
         title="Development"
         data-technical-essays-nav>
        <img class="repo-top__labs-icon" src="/icons/tinker-mark.svg?v=40" alt="" width="20" height="20" aria-hidden="true" />
      </button>
      <button type="button" class="repo-top__past-essays" id="repo-past-essays"
              aria-label="Founder Source" title="Founder Source" aria-expanded="false"
              aria-controls="repo-right">
        <svg class="repo-top__past-essays-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                d="M4 5h16M4 12h16M4 19h16"/>
        </svg>
      </button>
    </header>

    <div class="repo-layout repo-layout--write" id="repo-layout">
      <div class="repo-ide-center" id="repo-ide-center">
        <main class="repo-center repo-write-safe-top" id="repo-editor-main" aria-label="Editor" hidden></main>
        <section class="repo-panel repo-panel--write" id="repo-panel" aria-label="Writing">
          <div class="repo-panel__body repo-panel__body--write" id="repo-panel-body">
            <div class="repo-panel__write" id="repo-panel-write">
              <div class="repo-surface writing repo-write-safe-top" id="repo-surface">
                <div class="repo-location" id="repo-location">
                  <div class="repo-location__field">
                    <img class="repo-location__globe" src="/icons/tinker-mark.svg?v=40" alt="" width="14" height="14" aria-hidden="true" />
                    <input type="text" class="repo-location__input writing-input" value="Home" readonly />
                  </div>
                </div>
                <div class="repo-pad" id="repo-pad">
                  <textarea class="writing-input repo-pad__turn" data-pad-turn="1" spellcheck="false" readonly></textarea>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <button type="button"
       class="repo-fab-new"
       id="repo-new-essay"
       aria-label="New essay"
       title="New essay">
      <svg class="repo-fab-new__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
              d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>

    <button type="button"
       class="repo-notion-connect"
       id="repo-notion-connect"
       aria-label="Connect Notion"
       title="Connect Notion"
       data-notion-connected="false">
      <svg class="repo-notion-connect__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.208v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V7.416c0-.606-.233-.933-.746-.886l-15.177.887c-.56.047-.749.327-.749.933zm14.337-.653c.093.42 0 .793-.28.886l-.7.327v9.986c-.607.327-1.167.514-1.634.514-.747 0-.933-.234-1.494-.933l-4.577-7.186v6.952l1.447.327s0 .793-1.12.793l-3.077.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.48c-.094-.42.14-1.026.793-1.073l3.456-.233 4.763 7.279v-6.44l-1.214-.28c-.093-.514.28-.886.747-.933zM1.936 1.035l14.29-.98c1.774-.14 2.242.093 2.849.746l3.922 2.754c.42.28.56.7.56 1.167v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.4-1.632z"/>
      </svg>
      <span class="repo-notion-connect__dot" aria-hidden="true"></span>
    </button>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var btn = document.getElementById("repo-notion-connect");
        if (params.get("connected") === "1" && btn) {
          btn.setAttribute("data-notion-connected", "true");
          btn.setAttribute("aria-label", "Notion connected");
          btn.setAttribute("title", "Notion connected");
        }
      })();
    </script>
  </body>
</html>
