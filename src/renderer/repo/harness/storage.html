<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storage section harness</title>
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/repo/repo.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-background, #fffdf7);
        color: var(--color-foreground, #2d2a26);
        font-family: "Instrument Sans", system-ui, sans-serif;
        padding: 32px;
      }
      .harness { max-width: 420px; }
      .harness h1 { margin: 0 0 8px; font-size: 18px; }
      .harness > p { margin: 0 0 16px; color: var(--color-muted, #6f6a65); font-size: 13px; }
      .panel {
        border: 1px solid var(--color-border, #e7e2d9);
        border-radius: 12px;
        background: var(--color-surface, #fff);
        padding: 14px;
      }
      .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      .modes button {
        height: 32px; padding: 0 12px; border: 1px solid var(--color-border, #e7e2d9);
        border-radius: 8px; background: #fff; cursor: pointer; font: inherit; font-size: 12px;
      }
      .modes button.is-active { border-color: var(--color-accent, #2d5a3d); }
      .repo-location__section {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-muted, #6f6a65);
      }
      .repo-location__option {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        margin: 0 0 6px;
        padding: 8px 10px;
        border: 1px solid var(--color-border, #e7e2d9);
        border-radius: 8px;
        background: var(--color-background, #fffdf7);
        text-align: left;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .repo-location__option.is-selected { border-color: var(--color-accent, #2d5a3d); }
      .repo-location__option-label { font-weight: 600; }
      .repo-location__option-detail { font-size: 11px; color: var(--color-muted, #6f6a65); }
      .repo-location__badge {
        font-size: 11px;
        color: var(--color-muted, #6f6a65);
      }
    </style>
  </head>
  <body>
    <div class="harness">
      <h1>Storage harness</h1>
      <p id="harness-mode-label">Stubbed desktop cloud roots</p>
      <div class="modes" id="harness-modes">
        <button type="button" data-mode="desktop-installed" class="is-active">Mac detected</button>
        <button type="button" data-mode="desktop-missing">Mac not installed</button>
        <button type="button" data-mode="web-chooser">Web Choose folder</button>
        <button type="button" data-mode="mobile">Mobile note</button>
      </div>
      <div class="panel" id="storage-panel" data-testid="storage-panel"></div>
    </div>

    <script src="/lib/storage-path-core.js"></script>
    <script src="/lib/fs-access-folder.js"></script>
    <script src="/lib/storage-adapters.js"></script>
    <script>
      (function () {
        var registered = null;
        var macFolder = {
          id: "mac-folder",
          label: "Mac folder…",
          detail: "",
          selected: false,
        };

        window.tinkerRepo = {
          registerLocationSection: function (spec) {
            if (!spec || spec.key !== "storage") return;
            registered = spec;
            renderPanel();
          },
          refreshLocation: function () { renderPanel(); },
        };

        function renderPanel() {
          var panel = document.getElementById("storage-panel");
          panel.innerHTML = "";
          var heading = document.createElement("p");
          heading.className = "repo-location__section";
          heading.textContent = "Storage";
          panel.appendChild(heading);

          var options = [macFolder];
          if (registered && typeof registered.getOptions === "function") {
            try { options = options.concat(registered.getOptions() || []); }
            catch (e) { /* ignore */ }
          }
          options.forEach(function (opt) {
            if (!opt) return;
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "repo-location__option" + (opt.selected ? " is-selected" : "");
            btn.setAttribute("data-option-id", opt.id || "");
            var label = document.createElement("span");
            label.className = "repo-location__option-label";
            label.textContent = opt.label || "";
            btn.appendChild(label);
            if (opt.detail) {
              var detail = document.createElement("span");
              detail.className = "repo-location__option-detail";
              detail.textContent = opt.detail;
              btn.appendChild(detail);
            }
            if (opt.badge) {
              var badge = document.createElement("span");
              badge.className = "repo-location__badge";
              badge.textContent = opt.badge;
              btn.appendChild(badge);
            }
            btn.addEventListener("click", function () {
              if (registered && registered.onSelect) registered.onSelect(opt);
            });
            panel.appendChild(btn);
          });
        }

        var modes = {
          "desktop-installed": {
            label: "Mac desktop: iCloud + Google Drive detected",
            setup: function () {
              window.tinker = {
                isDesktopApp: true,
                supportsWebview: true,
                cloudStorageRoots: function () {
                  return Promise.resolve([
                    {
                      id: "icloud",
                      label: "iCloud Drive",
                      path: "/Users/tyler/Library/Mobile Documents/com~apple~CloudDocs",
                      installed: true,
                    },
                    {
                      id: "google-drive:tyler@lindowlabs.dev",
                      label: "Google Drive (tyler@lindowlabs.dev)",
                      path: "/Users/tyler/Library/CloudStorage/GoogleDrive-tyler@lindowlabs.dev/My Drive",
                      installed: true,
                      account: "tyler@lindowlabs.dev",
                    },
                  ]);
                },
                useCloudStorageRoot: function (id) {
                  return Promise.resolve({
                    id: id,
                    label: id.indexOf("icloud") === 0 ? "iCloud Drive" : "Google Drive (tyler@lindowlabs.dev)",
                    path: "/Users/tyler/Cloud/" + id + "/Tinker",
                    name: "Tinker",
                  });
                },
                pickNotesFolder: function () { return Promise.resolve(null); },
                writeNotesFile: function () { return Promise.resolve(true); },
                listNotesFiles: function () { return Promise.resolve([]); },
              };
              window.showDirectoryPicker = undefined;
            },
          },
          "desktop-missing": {
            label: "Mac desktop: cloud roots not installed",
            setup: function () {
              window.tinker = {
                isDesktopApp: true,
                supportsWebview: true,
                cloudStorageRoots: function () {
                  return Promise.resolve([
                    { id: "icloud", label: "iCloud Drive", path: "", installed: false },
                    { id: "google-drive", label: "Google Drive", path: "", installed: false, account: "" },
                  ]);
                },
                useCloudStorageRoot: function () { return Promise.resolve(null); },
                pickNotesFolder: function () { return Promise.resolve(null); },
                writeNotesFile: function () { return Promise.resolve(true); },
                listNotesFiles: function () { return Promise.resolve([]); },
              };
              window.showDirectoryPicker = undefined;
            },
          },
          "web-chooser": {
            label: "Desktop Chrome/Edge: Choose folder",
            setup: function () {
              window.tinker = undefined;
              window.showDirectoryPicker = function () {
                return Promise.reject(Object.assign(new Error("cancelled"), { name: "AbortError" }));
              };
              try {
                Object.defineProperty(window, "isSecureContext", { value: true, configurable: true });
              } catch (e) { /* ignore */ }
              try {
                Object.defineProperty(navigator, "userAgent", {
                  value: "Mozilla/5.0 (Macintosh; Intel Mac OS X) Chrome/120.0.0.0",
                  configurable: true,
                });
              } catch (e2) { /* ignore */ }
            },
          },
          mobile: {
            label: "Mobile web: quiet Mac app note",
            setup: function () {
              window.tinker = undefined;
              window.showDirectoryPicker = undefined;
              try {
                Object.defineProperty(navigator, "userAgent", {
                  value: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)",
                  configurable: true,
                });
              } catch (e) { /* ignore */ }
            },
          },
        };

        function loadSection() {
          return new Promise(function (resolve, reject) {
            registered = null;
            var prev = document.getElementById("storage-section-script");
            if (prev) prev.parentNode.removeChild(prev);
            window.tinkerRepoStorage = undefined;
            var s = document.createElement("script");
            s.id = "storage-section-script";
            s.src = "/repo/storage-section.js?ts=" + Date.now();
            s.onload = resolve;
            s.onerror = reject;
            document.body.appendChild(s);
          });
        }

        async function applyMode(mode) {
          var cfg = modes[mode];
          if (!cfg) return;
          document.getElementById("harness-mode-label").textContent = cfg.label;
          document.querySelectorAll("#harness-modes button").forEach(function (btn) {
            btn.classList.toggle("is-active", btn.getAttribute("data-mode") === mode);
          });
          document.body.setAttribute("data-harness-mode", mode);
          cfg.setup();
          await loadSection();
          await new Promise(function (r) { setTimeout(r, 120); });
          renderPanel();
        }

        document.getElementById("harness-modes").addEventListener("click", function (event) {
          var btn = event.target.closest("button[data-mode]");
          if (!btn) return;
          applyMode(btn.getAttribute("data-mode"));
        });

        applyMode("desktop-installed");
      })();
    </script>
  </body>
</html>
