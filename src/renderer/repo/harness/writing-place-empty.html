<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>tinker - writing empty state (no place)</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=40" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/repo/repo.css?v=72" />
  </head>
  <!-- Static: first screen with no place selected - empty-state copy visible. -->
  <body class="repo-page repo-page--write" data-repo-mode="write">
    <header class="repo-top repo-top--labs" aria-label="Tools">
            <button type="button"
         class="repo-top__labs"
         id="repo-labs-link"
         aria-label="Development"
         title="Development"
         data-technical-essays-nav>
        <img class="repo-top__labs-icon" src="/icons/tinker-mark.svg?v=40" alt="" width="20" height="20" aria-hidden="true" />
      </button>
      <button type="button" class="repo-top__past-essays" id="repo-past-essays"
              aria-label="Founder Source" title="Founder Source" aria-expanded="false"
              aria-controls="repo-right">
        <svg class="repo-top__past-essays-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                d="M4 5h16M4 12h16M4 19h16"/>
        </svg>
      </button>
    </header>

    <div class="repo-layout repo-layout--write" id="repo-layout">
      <div class="repo-ide-center" id="repo-ide-center">
        <main class="repo-center repo-write-safe-top" id="repo-editor-main" aria-label="Editor" hidden></main>
        <section class="repo-panel repo-panel--write" id="repo-panel" aria-label="Writing">
          <div class="repo-panel__body repo-panel__body--write" id="repo-panel-body">
            <div class="repo-panel__write" id="repo-panel-write">
              <div class="repo-surface writing repo-write-safe-top" id="repo-surface">
                <div class="repo-location" id="repo-location">
                  <div class="repo-location__field">
                    <img class="repo-location__globe" src="/icons/tinker-mark.svg?v=40" alt="" width="14" height="14" aria-hidden="true" />
                    <span class="visually-hidden" id="repo-location-caption">Location</span>
                    <input type="text" class="repo-location__input writing-input" id="repo-location-input"
                           placeholder="Where are you?" value="" readonly
                           aria-labelledby="repo-location-caption" />
                  </div>
                </div>
                <div class="repo-write-empty" id="repo-write-empty">
                  <p class="repo-write-empty__title">Pick a place to begin</p>
                  <p class="repo-write-empty__copy">Choose where you are above, then write.</p>
                </div>
                <div class="repo-pad" id="repo-pad"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
      <button type="button"
       class="repo-fab-new"
       id="repo-new-essay"
       aria-label="New essay"
       title="New essay">
      <svg class="repo-fab-new__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
              d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>

  </body>
</html>
