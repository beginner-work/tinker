<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/styles.css?v=40" />
<link rel="stylesheet" href="/design-tokens.css" />
<link rel="stylesheet" href="/repo/repo.css?v=52" />
<style>body{margin:0;padding:32px;background:var(--color-background,#fffdf7)}</style>
</head><body>
<div style="max-width:560px;display:grid;gap:16px">
  <div class="repo-exercise-chip is-pending">
    <span class="repo-exercise-chip__spinner" aria-hidden="true"></span>
    <span class="repo-exercise-chip__label">Updating Stripe PaymentIntent (test mode)…</span>
    <button type="button" class="repo-exercise-chip__retry" hidden>Retry</button>
    <button type="button" class="repo-exercise-chip__clear" aria-label="Detach exercise">×</button>
  </div>
  <div class="repo-explorer__group is-transforming" style="border:1px solid var(--color-border);border-radius:10px;padding:8px">
    <div class="repo-explorer__group-row">
      <button type="button" class="repo-explorer__group-btn" style="display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;font:inherit">
        <span class="repo-explorer__chevron" aria-hidden="true">▾</span>
        <span class="repo-explorer__name">Stripe PaymentIntent (test mode)</span>
        <span class="repo-ex-transform-spinner" aria-label="Updating exercise"></span>
      </button>
    </div>
  </div>
</div>
</body></html>
