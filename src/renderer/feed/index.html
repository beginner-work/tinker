<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fffdf7" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self';" />
    <title>Essay feed</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/feed/feed.css" />
  </head>
  <body class="feed-page">
    <header class="feed-chrome">
      <a class="feed-chrome__write" href="/">Writing</a>
      <div class="feed-chrome__filters" role="tablist" aria-label="Feed filter">
        <button type="button" class="feed-filter is-active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="feed-filter" data-filter="starred" role="tab" aria-selected="false">Starred</button>
      </div>
      <p id="feed-status" class="feed-chrome__status" role="status"></p>
    </header>

    <p id="feed-desktop-note" class="feed-desktop-note" hidden>
      This feed is built for phone reading.
      <a href="/">Open the writing flow</a> on desktop.
    </p>

    <main id="feed-scroller" class="feed-scroller" aria-label="Essay feed"></main>

    <p id="feed-empty" class="feed-empty" hidden>No essays yet.</p>

    <script src="/feed/feed.js"></script>
  </body>
</html>
