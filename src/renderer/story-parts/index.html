<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self';" />
    <title>Story parts</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <style>
      html, body.story-parts-page { height: auto; min-height: 100vh; overflow: auto; display: block; background: var(--color-background); }
      .sp { max-width: 40rem; margin: 0 auto; padding: 40px 20px 80px; }
      .sp__nav { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; font-size: 13px; }
      .sp__nav a { color: var(--color-muted); text-decoration: none; }
      .sp__nav a:hover { color: var(--color-foreground); }
      .sp__title { margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 650; letter-spacing: -0.02em; }
      .sp__lede { margin: 8px 0 24px; color: var(--color-muted); font-size: 15px; line-height: 1.5; }
      .sp__status { min-height: 1.2em; margin: 0 0 12px; font-size: 14px; color: var(--color-muted); }
      .sp__status--error { color: #b3261e; }
      .sp__form, .sp__stage { margin: 0 0 28px; padding: 16px 0 20px; border-top: 1px solid var(--color-border); }
      .sp__heading { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-muted); }
      .sp__field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
      .sp__field label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-muted); }
      .sp__input, .sp__select, .sp__textarea {
        padding: 8px 0; border: 0; border-bottom: 1px solid var(--color-border);
        border-radius: 0; background: transparent; font: inherit; font-size: 14px; color: inherit;
      }
      .sp__textarea { min-height: 96px; resize: vertical; width: 100%; }
      .sp__button {
        padding: 8px 12px; border: 0; border-bottom: 2px solid var(--color-accent-strong);
        background: transparent; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .sp__list { list-style: none; margin: 0; padding: 0; }
      .sp__item { padding: 12px 0; border-bottom: 1px solid var(--color-border); }
      .sp__item-meta { font-size: 12px; color: var(--color-muted); margin: 0 0 4px; }
      .sp__item-body { margin: 0; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
      .sp__empty { margin: 0; color: var(--color-muted); font-size: 14px; }
    </style>
  </head>
  <body class="story-parts-page">
    <main class="sp">
      <nav class="sp__nav" aria-label="Shell">
        <a href="/">Inbox</a>
        <a href="/story-parts" aria-current="page">Story parts</a>
        <a href="/leads">Leads</a>
        <a href="/career">Career</a>
      </nav>
      <h1 class="sp__title">Story parts</h1>
      <p class="sp__lede">Short pieces of your story you can insert into outreach drafts. Tinker never sends.</p>
      <p id="sp-status" class="sp__status" role="status"></p>

      <section class="sp__form" aria-labelledby="sp-form-heading">
        <h2 id="sp-form-heading" class="sp__heading">Add a part</h2>
        <form id="sp-form">
          <div class="sp__field">
            <label for="sp-stage">Stage</label>
            <select id="sp-stage" class="sp__select" required></select>
          </div>
          <div class="sp__field">
            <label for="sp-body">Text</label>
            <textarea id="sp-body" class="sp__textarea" required maxlength="8000"
                      placeholder="One hook, proof point, or ask in your own words."></textarea>
          </div>
          <button class="sp__button" type="submit">Save part</button>
        </form>
      </section>

      <div id="sp-board"></div>
    </main>
    <script src="/story-parts/story-parts.js"></script>
  </body>
</html>
