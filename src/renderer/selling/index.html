<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self';" />
    <title>Selling parts</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <style>
      html, body.selling-page { height: auto; min-height: 100vh; min-height: 100dvh; overflow: hidden; display: block; }
      .selling { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; height: 100vh; height: 100dvh; }
      .selling__rail { display: flex; flex-direction: column; border-right: 1px solid var(--color-border); background: var(--color-background); min-height: 0; }
      .selling__head { padding: 20px 16px 10px; }
      .selling__title { margin: 0; font-family: var(--font-display); font-variation-settings: var(--font-display-settings); font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
      .selling__lede { margin: 6px 0 0; color: var(--color-muted); font-size: 13px; line-height: 1.4; }
      .selling__tabs, .selling__filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
      .selling__tab, .selling__filter, .selling__btn, .selling__ghost { padding: 7px 11px; border-radius: var(--radius-button); font-size: 13px; font-weight: 600; border: 1px solid var(--color-border); background: transparent; }
      .selling__tab[aria-selected="true"], .selling__filter[aria-pressed="true"] { background: var(--color-accent-dim); border-color: var(--color-accent); }
      .selling__btn { background: var(--color-accent-strong); border-color: var(--color-accent-strong); color: #fff; }
      .selling__btn:disabled, .selling__ghost:disabled { opacity: 0.55; cursor: progress; }
      .selling__status { min-height: 1.2em; margin: 0 16px 8px; color: #b3261e; font-size: 13px; }
      .selling__list { list-style: none; margin: 0; padding: 0 8px 24px; overflow: auto; flex: 1; min-height: 0; }
      .selling__row { width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--radius-card); border: 1px solid transparent; margin-bottom: 4px; }
      .selling__row[aria-current="true"], .selling__row:hover { background: var(--color-card); border-color: var(--color-border); }
      .selling__name { display: block; font-size: 14px; font-weight: 600; }
      .selling__meta { display: block; margin-top: 2px; color: var(--color-muted); font-size: 12px; line-height: 1.4; }
      .selling__chip { display: inline-block; margin-top: 6px; margin-right: 4px; padding: 2px 7px; border-radius: var(--radius-chip); background: var(--color-surface-alt); border: 1px solid var(--color-border); font-size: 11px; }
      .selling__stage { min-width: 0; min-height: 0; overflow: auto; padding: 24px 20px 48px; background: var(--color-surface); }
      .selling__empty { margin: 40px auto; max-width: 28rem; color: var(--color-muted); font-size: 15px; line-height: 1.5; }
      .selling__panel-title { margin: 0 0 4px; font-family: var(--font-display); font-variation-settings: var(--font-display-settings); font-size: 24px; font-weight: 650; }
      .selling__back { display: none; margin-bottom: 12px; }
      .selling__section { margin: 24px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-muted); }
      .selling__source, .selling__form, .selling__card, .selling__event { padding: 14px 16px; margin: 0 0 10px; background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-card); }
      .selling__source-text { white-space: pre-wrap; font-size: 14px; line-height: 1.55; max-height: 40vh; overflow: auto; }
      .selling__form { display: grid; gap: 8px; max-width: 36rem; }
      .selling__label { font-size: 12px; color: var(--color-muted); }
      .selling__input, .selling__select, .selling__area { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-button); background: var(--color-surface); font: inherit; font-size: 14px; }
      .selling__area { min-height: 96px; resize: vertical; }
      .selling__actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .selling__board { display: grid; gap: 16px; }
      .selling__column h3 { margin: 0 0 8px; font-size: 14px; }
      .selling__event { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; font-size: 12px; color: var(--color-muted); }
      @media (max-width: 700px) {
        .selling { grid-template-columns: 1fr; }
        .selling__rail, .selling__stage { display: none; }
        body[data-selling-panel="list"] .selling__rail { display: flex; }
        body[data-selling-panel="detail"] .selling__stage { display: block; }
        .selling__back { display: inline-flex; }
      }
    </style>
  </head>
  <body class="selling-page" data-selling-panel="list">
    <div class="selling">
      <aside class="selling__rail">
        <div class="selling__head">
          <h1 class="selling__title">Selling parts</h1>
          <p class="selling__lede">Break content into stage-tagged parts. No send.</p>
        </div>
        <div class="selling__tabs" role="tablist">
          <button type="button" class="selling__tab" id="tab-sources" role="tab" aria-selected="true">Sources</button>
          <button type="button" class="selling__tab" id="tab-board" role="tab" aria-selected="false">Board</button>
          <button type="button" class="selling__tab" id="tab-stages" role="tab" aria-selected="false">Stages</button>
        </div>
        <div class="selling__filters" id="board-filters" hidden></div>
        <p id="selling-status" class="selling__status" role="status"></p>
        <ul id="selling-list" class="selling__list"></ul>
      </aside>
      <main id="selling-stage" class="selling__stage">
        <p class="selling__empty">Pick a source, or open the board.</p>
      </main>
    </div>
    <script src="/selling/excerpt.js"></script>
    <script src="/selling/selling.js"></script>
  </body>
</html>
