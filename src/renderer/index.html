<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.anthropic.com; script-src 'self';" />
    <title>tinker</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Drafts">
      <div class="sidebar__head">
        <button id="nav-home" class="sidebar__brand" type="button" title="Back to feed">
          <svg viewBox="0 0 200 200" width="22" height="22" aria-hidden="true" fill="none">
            <rect width="200" height="200" rx="44" fill="#f5f3ef" />
            <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="11" />
            <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="11" stroke-linecap="round" />
            <line x1="34.2" y1="62" x2="165.8" y2="62" stroke="#f9a8d4" stroke-width="11" stroke-linecap="round" />
            <line x1="34.2" y1="138" x2="165.8" y2="138" stroke="#fde68a" stroke-width="11" stroke-linecap="round" />
            <line x1="100" y1="24" x2="100" y2="176" stroke="#6ee7b7" stroke-width="11" stroke-linecap="round" />
            <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="11" />
            <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="11" />
          </svg>
          <span class="sidebar__name">tinker</span>
        </button>
      </div>

      <button id="new-session" class="sidebar__new" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span>New draft</span>
      </button>

      <div class="sidebar__label">Drafts</div>
      <div id="sessions" class="sidebar__sessions" role="tablist" aria-label="Drafts"></div>

      <footer class="sidebar__footer">
        <span>&copy; 2026 tinker</span>
      </footer>

      <div id="loadbar" class="loadbar" aria-hidden="true"><span></span></div>
    </aside>

    <main class="stage" id="stage" role="main">
      <!-- LinkedIn-shaped feed: compact "start writing" entry up top,
           then a vertical column of essay cards from other founders. -->
      <section id="welcome" class="feed" data-active>
        <div class="feed__inner">
          <div class="composer" id="composer" role="button" tabindex="0"
               aria-label="Start writing — what are you learning?">
            <div class="composer__prompt">What are you learning?</div>
            <div class="composer__chip">Start writing</div>
          </div>

          <div class="feed__label">From other founders</div>
          <div id="feed-list" class="feed__list" role="feed"></div>
        </div>
      </section>

      <!-- Writing flow takes over the center column when a draft is open.
           Sidebar stays visible. One question per screen, large input,
           progress dots. Closing returns to the feed; reopening the
           draft restores exactly. -->
      <section id="writing" class="writing" hidden>
        <header class="writing__top">
          <button id="writing-close" class="writing__close" type="button" aria-label="Close — save and return to feed">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div id="writing-progress" class="writing__progress" aria-hidden="true"></div>
          <div class="writing__step" id="writing-step"></div>
        </header>

        <div class="writing__body">
          <div id="writing-stage" class="writing__stage"></div>
        </div>

        <footer class="writing__foot">
          <button id="writing-end" class="writing__end" type="button" disabled>This is everything →</button>
          <button id="writing-next" class="writing__next" type="button">Next →</button>
        </footer>
      </section>

      <!-- Read-an-essay view: rendered when a feed card is opened. -->
      <section id="read" class="read" hidden>
        <header class="read__top">
          <button id="read-close" class="read__close" type="button" aria-label="Back to feed">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span>Feed</span>
          </button>
          <div class="read__url" id="read-url"></div>
        </header>
        <article class="read__body" id="read-body"></article>
      </section>
    </main>

    <script src="./platform-mobile.js" defer></script>
    <script src="./lib/rainbow-web.js" defer></script>
    <script src="./icon-init.js" defer></script>
    <script src="./writing.js" defer></script>
    <script src="./renderer.js" defer></script>
  </body>
</html>
