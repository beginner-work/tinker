<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://vercel.live wss://ws-us3.pusher.com; script-src 'self' https://vercel.live; frame-src https://vercel.live;" />
    <title>tinker</title>
    <!-- Belt + suspenders: this tag tells well-behaved crawlers not to
         index the app; the X-Robots-Tag header in vercel.json catches
         the rest (including agents that ignore meta robots). Together
         they keep the private-beta surface off Google. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./design-tokens.css" />
    <link rel="stylesheet" href="./mobile-drawer.css" />
    <link rel="stylesheet" href="./pwa-install-hint.css" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/tinker-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/tinker-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/tinker-icon-180.png" />
    <meta name="theme-color" content="#F5F3EF" />
    <meta name="apple-mobile-web-app-title" content="tinker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script src="./transactions.js" defer></script>
    <script src="./locations.js" defer></script>
    <script src="./heatmap.js" defer></script>
  </head>
  <body>
    <button id="drawer-toggle" class="drawer-toggle" type="button"
            aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Locations">
      <header class="sidebar__top">
        <button id="nav-home" class="sidebar__brand" type="button" title="Pick a place to start writing">
          <svg data-rainbow-logo viewBox="0 0 200 200" width="22" height="22" aria-hidden="true" fill="none">
            <rect width="200" height="200" rx="44" fill="#f5f3ef" />
            <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="9" />
            <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="9" stroke-linecap="round" />
            <line x1="34.2" y1="62" x2="165.8" y2="62" stroke="#f9a8d4" stroke-width="9" stroke-linecap="round" />
            <line x1="34.2" y1="138" x2="165.8" y2="138" stroke="#fde68a" stroke-width="9" stroke-linecap="round" />
            <line x1="100" y1="24" x2="100" y2="176" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" />
            <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="9" />
            <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="9" />
          </svg>
          <span class="sidebar__name">tinker</span>
        </button>
      </header>

      <div id="home-list" class="home-list" aria-live="polite"></div>

      <nav class="sidebar__account" aria-label="Account">
        <h2 class="sidebar__account-head">Account</h2>
        <ul class="sidebar__account-list">
          <li>
            <button id="nav-receipts" type="button" class="sidebar__account-item">
              <svg class="sidebar__account-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <span class="sidebar__account-label">Receipts</span>
            </button>
          </li>
        </ul>
      </nav>

      <footer class="sidebar__footer">
        <span class="sidebar__footer-copy">&copy; 2026 tinker</span>
      </footer>

      <div id="loadbar" class="loadbar" aria-hidden="true"><span></span></div>
    </aside>

    <main class="stage" id="stage" role="main">
      <!-- Default landing: a quiet empty state that points back at the
           sidebar. Once a location is tapped, #writing takes over. -->
      <section id="welcome" class="feed welcome" data-active>
        <div class="welcome__inner">
          <div class="welcome__logo" aria-hidden="true">
            <svg data-rainbow-logo viewBox="0 0 200 200" width="56" height="56" fill="none">
              <rect width="200" height="200" rx="44" fill="#f5f3ef" />
              <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="9" />
              <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="9" stroke-linecap="round" />
              <line x1="34.2" y1="62" x2="165.8" y2="62" stroke="#f9a8d4" stroke-width="9" stroke-linecap="round" />
              <line x1="34.2" y1="138" x2="165.8" y2="138" stroke="#fde68a" stroke-width="9" stroke-linecap="round" />
              <line x1="100" y1="24" x2="100" y2="176" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" />
              <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="9" />
              <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="9" />
            </svg>
          </div>
          <h1 class="welcome__question">Where are you?</h1>
          <form id="welcome-form" class="welcome__form" autocomplete="off">
            <input id="welcome-input" class="welcome__input" type="text"
                   placeholder="A coffee shop, your kitchen, the back porch…"
                   autocomplete="off" spellcheck="false" maxlength="120" />
            <button type="submit" class="welcome__submit">Start →</button>
          </form>
          <div id="welcome-pills" class="welcome__pills" aria-label="Previous locations" hidden></div>
        </div>
      </section>

      <!-- Writing flow takes over the centre column when a draft is open.
           Sidebar stays visible. One question per screen, large input,
           progress dots. Closing returns to the feed; reopening the draft
           restores exactly. -->
      <section id="writing" class="writing" hidden>
        <header class="writing__top">
          <button id="writing-close" class="writing__close" type="button" aria-label="Close — save and return to feed">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div id="writing-progress" class="writing__progress" aria-hidden="true"></div>
          <div class="writing__step" id="writing-step"></div>
        </header>

        <div class="writing__body">
          <div id="writing-stage" class="writing__stage"></div>
        </div>

        <footer class="writing__foot">
          <button id="writing-end" class="writing__end" type="button" disabled>This is everything →</button>
          <button id="writing-next" class="writing__next" type="button">Next →</button>
        </footer>
      </section>

      <!-- Read-an-essay view: rendered when a feed card is opened. -->
      <section id="read" class="read" hidden>
        <header class="read__top">
          <button id="read-close" class="read__close" type="button" aria-label="Back to feed">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span>Feed</span>
          </button>
          <div class="read__url" id="read-url"></div>
        </header>
        <article class="read__body" id="read-body"></article>
      </section>
    </main>

    <!-- Phone/PIN auth gate. Hidden by default; auth.js shows it on the
         web (when there is no JWT in localStorage) and stays out of the
         way on Electron desktop. -->
    <div id="auth-gate" class="auth-gate" hidden>
      <div class="auth-gate__inner">
        <div class="auth-gate__brand" aria-hidden="true">
          <svg data-rainbow-logo viewBox="0 0 200 200" width="48" height="48" fill="none">
            <rect width="200" height="200" rx="44" fill="#f5f3ef" />
            <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="9" />
            <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="9" stroke-linecap="round" />
            <line x1="34.2" y1="62" x2="165.8" y2="62" stroke="#f9a8d4" stroke-width="9" stroke-linecap="round" />
            <line x1="34.2" y1="138" x2="165.8" y2="138" stroke="#fde68a" stroke-width="9" stroke-linecap="round" />
            <line x1="100" y1="24" x2="100" y2="176" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" />
            <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="9" />
            <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="9" />
          </svg>
        </div>

        <h1 class="auth-gate__title" data-step-title>Sign in to tinker</h1>
        <p class="auth-gate__lede" data-step-lede>
          Enter your phone — we'll text you a six-digit code.
        </p>

        <form id="auth-phone-form" class="auth-gate__pill" data-step="phone" role="search">
          <span class="auth-gate__cc" aria-hidden="true">+1</span>
          <input id="auth-phone-input" type="tel" inputmode="numeric" autocomplete="tel-national"
                 placeholder="(555) 000-0000" maxlength="14" aria-label="Phone number" required />
          <button type="submit" class="auth-gate__begin">Send code</button>
        </form>

        <form id="auth-pin-form" class="auth-gate__pill auth-gate__pill--pin" data-step="pin" role="search" hidden>
          <input id="auth-pin-input" type="text" inputmode="numeric" autocomplete="one-time-code"
                 placeholder="000000" maxlength="6" pattern="\d{6}" aria-label="Six-digit code" required />
          <button type="submit" class="auth-gate__begin">Verify</button>
        </form>

        <div id="auth-status" class="auth-gate__status" role="status" aria-live="polite"></div>

        <button type="button" id="auth-back" class="auth-gate__link" hidden>← Use a different number</button>

        <p class="auth-gate__fineprint">
          Sign-up and login share this screen — first-time users get an
          account created automatically when they verify.
        </p>
      </div>
    </div>

    <!-- iOS Safari "Add to Home Screen" coach mark. Hidden by default;
         pwa-install-hint.js reveals it only on iOS Safari (mobile web,
         not standalone, not Capacitor) and remembers dismissal. The
         glass surface is borrowed from Safari's own toolbar so it
         reads as part of the chrome. The inline share glyph in the
         message mirrors Safari's Share button — the first step in
         the Add-to-Home-Screen flow. -->
    <aside id="pwa-hint" class="pwa-hint" role="dialog" aria-live="polite"
           aria-label="Add tinker to your Home Screen">
      <div class="pwa-hint__card">
        <span class="pwa-hint__icon" aria-hidden="true">
          <svg data-rainbow-logo viewBox="0 0 200 200" width="24" height="24" fill="none">
            <rect width="200" height="200" rx="44" fill="#f5f3ef" />
            <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="9" />
            <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="9" stroke-linecap="round" />
            <line x1="34.2" y1="62" x2="165.8" y2="62" stroke="#f9a8d4" stroke-width="9" stroke-linecap="round" />
            <line x1="34.2" y1="138" x2="165.8" y2="138" stroke="#fde68a" stroke-width="9" stroke-linecap="round" />
            <line x1="100" y1="24" x2="100" y2="176" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" />
            <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="9" />
            <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="9" />
          </svg>
        </span>
        <div class="pwa-hint__copy">
          <div class="pwa-hint__title">Keep tinker one tap away</div>
          <div class="pwa-hint__steps">
            Tap
            <span class="pwa-hint__share" aria-label="Share button">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none">
                <path d="M4.5 7.5 V12.5 H11.5 V7.5"
                      stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round" />
                <path d="M8 2 V10 M5.5 4.5 L8 2 L10.5 4.5"
                      stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="pwa-hint__arrow-glyph" aria-hidden="true">→</span>
            Add to Home Screen
          </div>
        </div>
        <button type="button" class="pwa-hint__close" aria-label="Dismiss">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Platform shim runs first. -->
    <script src="./platform-mobile.js" defer></script>
    <script src="./auth.js" defer></script>
    <script src="./lib/rainbow-web.js" defer></script>
    <script src="./icon-init.js" defer></script>
    <script src="./writing.js" defer></script>
    <script src="./renderer.js" defer></script>
    <script src="./mobile-drawer.js" defer></script>
    <script src="./pwa-install-hint.js" defer></script>
  </body>
</html>
