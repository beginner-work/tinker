<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self';" />
    <title>tinker</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Sessions">
      <!-- The top of the sidebar is a window-drag region so users
           can still move the frameless window. The traffic-light
           buttons sit inside this padding on macOS. -->
      <div class="sidebar__head">
        <div class="sidebar__brand" title="tinker">
          <svg viewBox="0 0 200 200" width="22" height="22" aria-hidden="true" fill="none">
            <rect width="200" height="200" rx="44" fill="#f5f3ef" />
            <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="11" />
            <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="11" stroke-linecap="round" />
            <line x1="34.2" y1="62" x2="165.8" y2="62" stroke="#f9a8d4" stroke-width="11" stroke-linecap="round" />
            <line x1="34.2" y1="138" x2="165.8" y2="138" stroke="#fde68a" stroke-width="11" stroke-linecap="round" />
            <line x1="100" y1="24" x2="100" y2="176" stroke="#6ee7b7" stroke-width="11" stroke-linecap="round" />
            <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="11" />
            <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="11" />
          </svg>
          <span class="sidebar__name">tinker</span>
        </div>
      </div>

      <div class="sidebar__nav" role="group" aria-label="Navigation">
        <button id="nav-back" class="icon-btn" title="Back" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
        </button>
        <button id="nav-forward" class="icon-btn" title="Forward" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
        </button>
        <button id="nav-reload" class="icon-btn" title="Reload" aria-label="Reload" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
        </button>
        <button id="nav-home" class="icon-btn" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2v-9z"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none" />
          </svg>
        </button>
      </div>

      <button id="new-session" class="sidebar__new" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span>New session</span>
      </button>

      <div class="sidebar__label">Sessions</div>
      <div id="sessions" class="sidebar__sessions" role="tablist" aria-label="Sessions"></div>

      <footer class="sidebar__footer">
        <span>&copy; 2026 tinker</span>
      </footer>

      <div id="loadbar" class="loadbar" aria-hidden="true"><span></span></div>
    </aside>

    <main class="stage" id="stage" role="main">
      <section id="welcome" class="welcome" data-active>
        <div class="welcome__inner">
          <h1 class="welcome__title">A new way to web</h1>

          <form id="welcome-form" class="welcome__search" role="search">
            <input id="welcome-input" type="text" inputmode="text" autocomplete="off" spellcheck="false"
                   placeholder="Start a new web" aria-label="Start a new web" />
            <button type="submit" id="welcome-submit" class="welcome__begin">Begin</button>
          </form>

          <button type="button" id="welcome-tinker" class="welcome__tinker">
            <span class="welcome__tinker-dot" aria-hidden="true"></span>
            <span>Or talk an idea out →</span>
          </button>
        </div>
      </section>

      <section id="tinker" class="tinker">
        <div class="tinker__stage">
          <div class="tinker__head">
            <h1 class="tinker__title">Talk an idea out.</h1>
            <p class="tinker__subtitle">We'll listen. You'll get a page back made of your own words.</p>
          </div>

          <div class="tinker__recorder" data-state="idle">
            <button type="button" id="tinker-record" class="tinker__record" aria-label="Start recording">
              <span class="tinker__record-ring" aria-hidden="true"></span>
              <span class="tinker__record-core" aria-hidden="true"></span>
            </button>
            <div class="tinker__status">
              <span id="tinker-status-text" class="tinker__status-text">Tap to start.</span>
              <span id="tinker-timer" class="tinker__timer" aria-hidden="true">00:00</span>
            </div>
          </div>

          <div class="tinker__transcript" id="tinker-transcript" hidden>
            <div class="tinker__transcript-label">Transcript</div>
            <div class="tinker__transcript-body" id="tinker-transcript-body"></div>
          </div>

          <div class="tinker__error" id="tinker-error" hidden></div>

          <div class="tinker__example">
            <div class="tinker__example-label">Here's the shape you'll get back · example</div>
            <div class="tinker__example-frame">
              <iframe class="tinker__example-iframe"
                      src="./templates/trajectory.html?example=1"
                      title="Example trajectory page"
                      loading="lazy"></iframe>
            </div>
          </div>

          <button type="button" id="tinker-back" class="tinker__back">← Back</button>
        </div>
      </section>

      <section id="trajectory-host" class="trajectory-host">
        <iframe id="trajectory-iframe" class="trajectory-host__iframe"
                src="about:blank"
                title="Your trajectory"></iframe>
      </section>
    </main>

    <!-- Platform shim runs first. On Electron it short-circuits because
         the preload has already installed window.tinker; on Capacitor
         and on the plain web it fills in the same surface so the rest
         of the renderer code path is identical. -->
    <script src="./platform-mobile.js" defer></script>
    <script src="./lib/rainbow-web.js" defer></script>
    <script src="./icon-init.js" defer></script>
    <script src="./renderer.js" defer></script>
  </body>
</html>
