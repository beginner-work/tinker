<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Listen to this post — lindowlabs embed preview</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --ink: #14141a;
        --muted: #5c5a66;
        --paper: #f7f4ee;
        --line: #e4dfd4;
        --accent: #2f5d50;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Instrument Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #efe8da 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #dde8e2 0%, transparent 50%),
          var(--paper);
      }
      .page {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2.5rem 0 4rem;
      }
      .eyebrow {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 650;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        line-height: 1.15;
        margin: 0.4rem 0 0.75rem;
      }
      .lede {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
        margin: 0 0 1rem;
      }
      .listen-link {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        margin: 0 0 0.75rem;
      }
      .any-url { font-size: 0.9rem; color: var(--muted); margin: 0 0 1.5rem; }
      .any-url a { color: var(--accent); font-weight: 600; }
      #tinker-reading { min-height: 520px; }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">Lindow Labs · embed preview</p>
      <h1>Over-Indexing on Intuition in the Age of AI</h1>
      <p class="lede">
        Listen CTA + Tinker reading widget embedded the way lindowlabs.dev blog
        posts should ship.
      </p>
      <p>
        <a class="listen-link" href="#tinker-reading">Listen to this post</a>
      </p>
      <p class="any-url">
        Or open any public URL in
        <a
          href="/reading-widget/?url=https%3A%2F%2Fsierra.ai%2Fblog%2Fgardening-week-evergreen-engineering"
          id="any-url"
          >Tinker Reading</a
        >.
      </p>
      <div id="tinker-reading"></div>
    </main>
    <script
      src="/reading-widget/embed.js"
      data-url="https://sierra.ai/blog/gardening-week-evergreen-engineering"
      data-mode="iframe"
      data-height="560"
      data-target="#tinker-reading"
      async
    ></script>
    <script>
      (function () {
        document.getElementById("any-url").href =
          "/reading-widget/?url=" +
          encodeURIComponent(
            "https://sierra.ai/blog/gardening-week-evergreen-engineering",
          );
      })();
    </script>
  </body>
</html>
