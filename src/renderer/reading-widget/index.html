<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Tinker Reading</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/reading-widget/widget.css" />
  </head>
  <body>
    <div id="demo" class="rw-demo-page" hidden>
      <h1>Tinker Reading</h1>
      <p class="lede">
        Milestone 1 reading agent. Paste any public article URL. Tinker fetches
        it at runtime, reads it aloud, answers interrupt questions grounded in
        the page (and linked sources when needed), then resumes. Third-party
        article text is not stored in this repo.
      </p>
      <form class="rw-demo-form" id="demo-form">
        <label for="demo-url">Public article URL</label>
        <input
          id="demo-url"
          name="url"
          type="url"
          required
          placeholder="https://example.com/blog/engineering-post"
          value=""
        />
        <button type="submit" class="rw-btn rw-btn-primary">Open reader</button>
      </form>
    </div>
    <div id="mount"></div>
    <script src="/reading-widget/widget.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search || "");
        var url = params.get("url") || "";
        var embed = params.get("embed") === "1";
        var autoplay = params.get("autoplay") === "1";
        if (embed) document.body.classList.add("rw-embed");

        var demo = document.getElementById("demo");
        var form = document.getElementById("demo-form");
        var input = document.getElementById("demo-url");

        function mountReader(articleUrl) {
          demo.hidden = true;
          document.getElementById("mount").innerHTML = "";
          window.TinkerReadingWidget.mount("#mount", {
            url: articleUrl,
            autoplay: autoplay,
          });
        }

        if (url) {
          mountReader(url);
        } else {
          demo.hidden = false;
          // Sample: Tyler's own public writing (first-party). Hosts may pass
          // any public engineering blog URL via ?url=.
          input.value = "https://lindowlabs.dev";
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            var next = String(input.value || "").trim();
            if (!next) return;
            history.replaceState(null, "", "?url=" + encodeURIComponent(next));
            mountReader(next);
          });
        }
      })();
    </script>
  </body>
</html>
