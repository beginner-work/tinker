<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http: https:; script-src 'self';" />
    <title>tinker chat</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body class="chat-body">
    <!-- ── Auth screen (login + signup share the same shell) ── -->
    <section id="screen-auth" class="auth-screen" data-active>
      <div class="auth-card">
        <div class="auth-brand">
          <svg viewBox="0 0 200 200" width="34" height="34" aria-hidden="true" fill="none">
            <rect width="200" height="200" rx="44" fill="#f5f3ef" />
            <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="11" />
            <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="11" stroke-linecap="round" />
            <line x1="34.2" y1="62" x2="165.8" y2="62" stroke="#f9a8d4" stroke-width="11" stroke-linecap="round" />
            <line x1="34.2" y1="138" x2="165.8" y2="138" stroke="#fde68a" stroke-width="11" stroke-linecap="round" />
            <line x1="100" y1="24" x2="100" y2="176" stroke="#6ee7b7" stroke-width="11" stroke-linecap="round" />
            <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="11" />
            <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="11" />
          </svg>
          <h1>tinker</h1>
        </div>
        <p class="auth-tagline">Sign in to start your onboarding feed.</p>

        <div class="auth-tabs" role="tablist">
          <button id="tab-login" class="auth-tab" role="tab" aria-selected="true">Log in</button>
          <button id="tab-signup" class="auth-tab" role="tab" aria-selected="false">Sign up</button>
        </div>

        <form id="auth-form" class="auth-form" novalidate>
          <label class="auth-field">
            <span>Email</span>
            <input id="auth-email" type="email" autocomplete="email" required />
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required />
            <small id="auth-password-hint" class="auth-hint">8+ characters</small>
          </label>
          <p id="auth-error" class="auth-error" hidden></p>
          <button id="auth-submit" type="submit" class="auth-submit">Log in</button>
        </form>

        <p class="auth-foot" id="auth-foot">
          Backend: <code id="auth-backend">…</code>
        </p>
      </div>
    </section>

    <!-- ── Feed screen (dynamic onboarding questions) ── -->
    <section id="screen-chat" class="feed-screen">
      <header class="feed-header">
        <div class="feed-header__brand">
          <svg viewBox="0 0 200 200" width="20" height="20" aria-hidden="true" fill="none">
            <rect width="200" height="200" rx="44" fill="#f5f3ef" />
            <circle cx="100" cy="100" r="76" stroke="#c8b6e2" stroke-width="11" />
            <line x1="24" y1="100" x2="176" y2="100" stroke="#fdba74" stroke-width="11" stroke-linecap="round" />
            <ellipse cx="100" cy="100" rx="26" ry="76" stroke="#7dd3fc" stroke-width="11" />
            <ellipse cx="100" cy="100" rx="52" ry="76" stroke="#7bc47a" stroke-width="11" />
          </svg>
          <span class="feed-header__title">tinker</span>
          <span class="feed-header__crumb">onboarding</span>
        </div>
        <div class="feed-header__user">
          <span id="feed-user" class="feed-header__email"></span>
          <button id="feed-logout" type="button" class="feed-header__logout">Log out</button>
        </div>
      </header>
      <main class="feed" aria-live="polite">
        <div id="feed-cards" class="feed__cards"></div>
        <p id="feed-banner" class="feed-banner" hidden></p>
      </main>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
