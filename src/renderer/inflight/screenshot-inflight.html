<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>In flight</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/inflight/inflight.css" />
  </head>
  <body class="inflight-page">
    <main class="inflight">
      <div class="inflight__top">
        <h1 class="inflight__brand">tinker</h1>
        <a class="inflight__write" href="/repo">Write</a>
      </div>
      <p class="inflight__sub">In flight</p>
      <ul class="inflight__list" aria-label="In-flight agents">
        <li class="inflight__row">
          <h2 class="inflight__title">Tinker: Exercises Blob SoT</h2>
          <div class="inflight__state">Running</div>
          <div class="inflight__meta">
            <span>beginner-work/tinker</span>
            <span>Just now</span>
          </div>
          <div class="inflight__bar" data-state="running" role="progressbar" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100"><span style="width:55%"></span></div>
        </li>
        <li class="inflight__row">
          <h2 class="inflight__title">Learning: OpenAPI payments</h2>
          <div class="inflight__state">PR open</div>
          <div class="inflight__meta">
            <span>beginner-work/tinker</span>
            <a class="inflight__pr" href="#">Pull request</a>
            <span>12 min ago</span>
          </div>
          <div class="inflight__bar" data-state="pr_open" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100"><span style="width:90%"></span></div>
        </li>
        <li class="inflight__row">
          <h2 class="inflight__title">Site: landing copy</h2>
          <div class="inflight__state">Creating</div>
          <div class="inflight__meta">
            <span>beginner-work/site</span>
            <span>1 hr ago</span>
          </div>
          <div class="inflight__bar" data-state="creating" role="progressbar" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100"><span style="width:15%"></span></div>
        </li>
      </ul>
    </main>
  </body>
</html>
