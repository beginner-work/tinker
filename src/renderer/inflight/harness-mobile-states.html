<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Inflight harness</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/inflight/inflight.css" />
    <style>
      body { margin: 0; }
      .harness-switch {
        position: sticky; top: 0; z-index: 5;
        display: flex; gap: 8px; padding: 8px;
        background: #fffdf7; border-bottom: 1px solid #ede8e0;
        font: 13px/1.3 "Instrument Sans", system-ui, sans-serif;
      }
      .harness-switch button {
        border: 1px solid #ede8e0; background: #fff; border-radius: 8px;
        padding: 8px 10px; font: inherit; cursor: pointer;
      }
      .harness-switch button[aria-pressed="true"] {
        background: #2d2a26; color: #fffdf7; border-color: #2d2a26;
      }
    </style>
  </head>
  <body class="inflight-page">
    <div class="harness-switch">
      <button type="button" id="btn-inflight" aria-pressed="true">In flight</button>
      <button type="button" id="btn-empty" aria-pressed="false">Nothing in flight</button>
    </div>
    <main class="inflight" id="inflight">
      <div class="inflight__top">
        <h1 class="inflight__brand">tinker</h1>
        <a class="inflight__write" id="inflight-write" href="/repo">Write</a>
      </div>
      <p class="inflight__sub">In flight</p>
      <p class="inflight__empty" id="inflight-empty" hidden></p>
      <ul class="inflight__list" id="inflight-list" aria-label="In-flight agents"></ul>
    </main>
    <script>
      (function () {
        var list = document.getElementById("inflight-list");
        var empty = document.getElementById("inflight-empty");
        var btnIn = document.getElementById("btn-inflight");
        var btnEmpty = document.getElementById("btn-empty");

        var sample = [
          {
            title: "Tinker: Exercises Blob SoT",
            repo: "beginner-work/tinker",
            state: "running",
            stateLabel: "Running",
            progress: 55,
            prUrl: "",
            updatedAt: "Just now",
          },
          {
            title: "Learning: OpenAPI payments",
            repo: "beginner-work/tinker",
            state: "pr_open",
            stateLabel: "PR open",
            progress: 90,
            prUrl: "#",
            updatedAt: "12 min ago",
          },
          {
            title: "Site: landing copy",
            repo: "beginner-work/site",
            state: "creating",
            stateLabel: "Creating",
            progress: 15,
            prUrl: "",
            updatedAt: "1 hr ago",
          },
        ];

        function renderInflight() {
          empty.hidden = true;
          list.hidden = false;
          list.innerHTML = "";
          sample.forEach(function (agent) {
            var li = document.createElement("li");
            li.className = "inflight__row";
            li.innerHTML =
              '<h2 class="inflight__title"></h2>' +
              '<div class="inflight__state"></div>' +
              '<div class="inflight__meta"></div>' +
              '<div class="inflight__bar" role="progressbar"><span></span></div>';
            li.querySelector(".inflight__title").textContent = agent.title;
            li.querySelector(".inflight__state").textContent = agent.stateLabel;
            var meta = li.querySelector(".inflight__meta");
            var repo = document.createElement("span");
            repo.textContent = agent.repo;
            meta.appendChild(repo);
            if (agent.prUrl) {
              var pr = document.createElement("a");
              pr.className = "inflight__pr";
              pr.href = agent.prUrl;
              pr.textContent = "Pull request";
              meta.appendChild(pr);
            }
            var when = document.createElement("span");
            when.textContent = agent.updatedAt;
            meta.appendChild(when);
            var bar = li.querySelector(".inflight__bar");
            bar.setAttribute("data-state", agent.state);
            bar.querySelector("span").style.width = agent.progress + "%";
            list.appendChild(li);
          });
          btnIn.setAttribute("aria-pressed", "true");
          btnEmpty.setAttribute("aria-pressed", "false");
          document.body.setAttribute("data-harness", "inflight");
        }

        function renderEmpty() {
          list.hidden = true;
          list.innerHTML = "";
          empty.hidden = false;
          empty.textContent = "Nothing in flight right now.";
          btnIn.setAttribute("aria-pressed", "false");
          btnEmpty.setAttribute("aria-pressed", "true");
          document.body.setAttribute("data-harness", "empty");
        }

        btnIn.addEventListener("click", renderInflight);
        btnEmpty.addEventListener("click", renderEmpty);
        var q = (location.search || "").toLowerCase();
        if (/(?:^|[?&])chrome=0(?:&|$)/.test(q)) {
          var sw = document.querySelector(".harness-switch");
          if (sw) sw.hidden = true;
        }
        if (/(?:^|[?&])state=empty(?:&|$)/.test(q)) renderEmpty();
        else renderInflight();
      })();
    </script>
  </body>
</html>
