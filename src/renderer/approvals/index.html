<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self';" />
    <title>Approvals</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/design-tokens.css" />
    <style>
      html, body.approvals-page {
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: auto;
        display: block;
      }
      .approvals {
        max-width: 40rem;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }
      .approvals__title {
        margin: 0;
        font-family: var(--font-display);
        font-variation-settings: var(--font-display-settings);
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .approvals__lede {
        margin: 8px 0 28px;
        color: var(--color-muted);
        font-size: 15px;
        line-height: 1.5;
      }
      .approvals__status {
        min-height: 1.2em;
        margin: 0 0 16px;
        color: #b3261e;
        font-size: 14px;
      }
      .approvals__list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .approvals__row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 16px;
        align-items: center;
        padding: 14px 16px;
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
      }
      .approvals__label {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.35;
      }
      .approvals__meta,
      .approvals__note {
        grid-column: 1 / -1;
        margin: 0;
        color: var(--color-muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .approvals__note { margin-top: 2px; }
      .approvals__switch {
        width: 44px;
        height: 26px;
        padding: 0;
        border-radius: 999px;
        border: 1px solid var(--color-border);
        background: #e7e1d8;
        position: relative;
        flex-shrink: 0;
      }
      .approvals__switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(45, 42, 38, 0.18);
        transition: transform 0.15s ease;
      }
      .approvals__switch[aria-checked="true"] {
        background: var(--color-accent-strong);
        border-color: var(--color-accent-strong);
      }
      .approvals__switch[aria-checked="true"]::after { transform: translateX(18px); }
      .approvals__switch:focus-visible {
        outline: 2px solid var(--color-accent-strong);
        outline-offset: 2px;
      }
      .approvals__switch:disabled { opacity: 0.55; cursor: progress; }
    </style>
  </head>
  <body class="approvals-page">
    <main class="approvals">
      <h1 class="approvals__title">Approvals</h1>
      <p class="approvals__lede">On means your approval is needed.</p>
      <p id="approvals-status" class="approvals__status" role="status"></p>
      <ul id="approvals-list" class="approvals__list"></ul>
    </main>
    <script src="/approvals/approvals.js"></script>
  </body>
</html>
