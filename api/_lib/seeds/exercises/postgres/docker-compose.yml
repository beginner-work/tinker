services:
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exercise
      POSTGRES_PASSWORD: exercise
      POSTGRES_DB: events
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - hot_standby=on
    volumes:
      - ./better/sql/primary-init.sh:/docker-entrypoint-initdb.d/01-primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exercise -d events"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Physical replica is heavy for a short exercise. This service is a second
  # Postgres we treat as a read replica: seed scripts copy schema + data,
  # and the better API sends SELECTs here and writes to primary.
  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exercise
      POSTGRES_PASSWORD: exercise
      POSTGRES_DB: events
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exercise -d events"]
      interval: 2s
      timeout: 5s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1-p1
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://exercise:exercise@postgres-primary:5432/events
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
