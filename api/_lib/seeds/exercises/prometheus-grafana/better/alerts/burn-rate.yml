groups:
  - name: checkout-slo-burn
    rules:
      # Recording rules: roll up success ratio without high-cardinality labels.
      - record: job:http_requests:rate5m
        expr: sum(rate(http_requests_total[5m]))

      - record: job:http_requests_success:rate5m
        expr: sum(rate(http_requests_total{status="200"}[5m]))

      - record: job:http_success:ratio_rate5m
        expr: job:http_requests_success:rate5m / clamp_min(job:http_requests:rate5m, 1e-9)

      - record: job:http_requests:rate1h
        expr: sum(rate(http_requests_total[1h]))

      - record: job:http_requests_success:rate1h
        expr: sum(rate(http_requests_total{status="200"}[1h]))

      - record: job:http_success:ratio_rate1h
        expr: job:http_requests_success:rate1h / clamp_min(job:http_requests:rate1h, 1e-9)

      # Multi-window burn-rate alert for a 99% availability SLO.
      # Fast burn: 14.4x over 5m (classic Google SRE multi-window style, simplified).
      - alert: CheckoutErrorBudgetBurnFast
        expr: |
          (1 - job:http_success:ratio_rate5m) > (14.4 * (1 - 0.99))
          and
          (1 - job:http_success:ratio_rate1h) > (14.4 * (1 - 0.99))
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Checkout SLO burn rate is high"
          description: "5m and 1h error rates exceed the fast burn threshold for a 99% SLO."
