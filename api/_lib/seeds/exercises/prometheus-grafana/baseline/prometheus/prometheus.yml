global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: checkout-baseline
    static_configs:
      - targets: ["host.docker.internal:5091"]
    # On Linux without host.docker.internal, use extra_hosts or scrape 172.17.0.1:5091.
    # For local-without-Docker scrape testing, hit /metrics on the app directly.
