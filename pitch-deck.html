section {
  width: 720px;
  height: 1280px;
  font-family: &quot;Instrument Sans&quot;, &quot;Inter&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif;
  background: #fffdf7;
  color: #2d2a26;
  padding: 96px 56px 64px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  font-size: 30px;
  line-height: 1.45;
}

/* Vertically center big-number slides */
section.market {
  justify-content: center;
}

h1, h2, h3 {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #2d2a26;
  margin: 0 0 0.5em;
}

section &gt; h1 {
  font-size: 72px;
  line-height: 1.05;
  margin: 0 0 40px;
}

blockquote {
  border-left: 4px solid #ede8e0;
  color: #2d2a26;
  font-size: 40px;
  line-height: 1.45;
  margin: 0 0 26px;
  padding: 0 0 0 32px;
  font-style: normal;
  quotes: none;
}
blockquote::before, blockquote::after { content: none; }
blockquote p { margin: 0; }

strong { color: #1a1a1a; font-weight: 700; }
em { font-style: italic; color: #2d2a26; }

section::after {
  font-family: &quot;Instrument Sans&quot;, &quot;Inter&quot;, sans-serif;
  font-size: 11px;
  color: #6f6a65;
  letter-spacing: 0.08em;
}

/* Cover slide — landing-page hero pattern */
section.cover {
  padding: 80px 48px 56px;
  text-align: center;
  align-items: center;
  justify-content: center;
}
section.cover .lockup {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin: 0 0 32px;
}
section.cover .lockup svg { width: 104px; height: 104px; }
section.cover .lockup .wm {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 800;
  font-size: 56px;
  letter-spacing: -0.03em;
  color: #2d5a3d;
  line-height: 1;
}
section.cover .kicker {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-style: italic;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: 0.02em;
  color: #6f6a65;
  margin: 0 0 24px;
}
section.cover &gt; h1 {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 64px;
  line-height: 1.04;
  letter-spacing: -0.03em;
  color: #2d2a26;
  margin: 0 0 24px;
  max-width: 600px;
}
section.cover .lede {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 500;
  font-size: 24px;
  line-height: 1.45;
  color: #4a4742;
  max-width: 540px;
  margin: 0 auto 32px;
}
section.cover .hero-rainbow {
  width: 200px;
  height: 6px;
  border-radius: 999px;
  margin: 0 auto;
  background: linear-gradient(90deg, #f9a8d4 0%, #fdba74 18%, #fde68a 36%, #7bc47a 55%, #7dd3fc 75%, #c4b5fd 100%);
}
section.cover .meta {
  margin-top: auto;
  padding-top: 24px;
  border-top: 1px solid #ede8e0;
  font-size: 20px;
  color: #6f6a65;
  letter-spacing: 0.02em;
  line-height: 1.7;
  text-align: center;
  width: 100%;
  max-width: 480px;
}

/* Tinker product slides — rainbow-web brand */
section.tinker {
  padding-top: 116px;
  justify-content: flex-start;
}
section.tinker .tinker-badge {
  position: absolute;
  top: 40px;
  left: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
}
section.tinker .tinker-badge svg { width: 48px; height: 48px; }
section.tinker .tinker-badge .wm {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.01em;
  color: #2d2a26;
}
section.tinker .tinker-rainbow {
  position: absolute;
  top: 54px;
  right: 56px;
  width: 160px;
  height: 6px;
  background: linear-gradient(90deg, #f9a8d4 0%, #fdba74 18%, #fde68a 36%, #7bc47a 55%, #7dd3fc 75%, #c4b5fd 100%);
  border-radius: 999px;
}
section.tinker blockquote { border-left: 3px solid #c8b6e2; }
section.tinker blockquote + blockquote { border-left-color: #7dd3fc; }

/* Closing — centered &quot;Thank you&quot; bookended with beginner + tinker marks */
section.closing { justify-content: center; align-items: center; padding-top: 80px; }
section.closing &gt; h1 {
  font-size: 96px;
  text-align: center;
  margin: 0;
  color: #2d5a3d;
  line-height: 1;
}
.beginner-badge {
  position: absolute;
  top: 40px;
  left: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.beginner-badge svg { width: 40px; height: 40px; }
.beginner-badge .wm {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 800;
  font-size: 28px;
  letter-spacing: -0.03em;
  color: #2d5a3d;
  line-height: 1;
}
section.closing .tinker-badge {
  position: absolute;
  top: 40px;
  right: 56px;
  left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
section.closing .tinker-badge svg { width: 40px; height: 40px; }
section.closing .tinker-badge .wm {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 28px;
  letter-spacing: -0.02em;
  color: #2d2a26;
  line-height: 1;
}
section.closing .closing-tagline {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 32px;
  letter-spacing: -0.02em;
  color: #2d2a26;
  text-align: center;
  margin: 24px 0 0;
}

/* Product slide — inline SVG screenshot */
.product-shot {
  display: block;
  width: 100%;
  max-width: 640px;

.gtm-duo .device__screen {
  position: relative;
  box-sizing: border-box;
  height: 600px;
  border-radius: 38px;
  overflow: hidden;
  background: #fffdf7;
  display: flex;
  flex-direction: column;
  font-family: &quot;Instrument Sans&quot;, &quot;Inter&quot;, system-ui, sans-serif;
}
.gtm-duo .device__screen * { box-sizing: border-box; }
.gtm-duo .device__pill {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 92px;
  height: 20px;
  border-radius: 11px;
  background: #111110;
  z-index: 6;
}
.gtm-duo .device__label {
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: #6f6a65;
  margin: 14px 0 0;
  font-family: &quot;Inter&quot;, sans-serif;
}

/* ── Screen 1 · the writing flow ─────────────────────────────────── */
.scr-write {
  background:
    radial-gradient(circle at 18% 8%, rgba(123, 196, 122, 0.10), transparent 40%),
    radial-gradient(circle at 88% 4%, rgba(165, 180, 252, 0.13), transparent 40%),
    #fffdf7;
}
.scr-write__top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 42px 18px 13px;
  border-bottom: 1px solid rgba(237, 232, 224, 0.6);
}
.scr-write__close {
  width: 26px;
  height: 26px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #2d2a26;
  font-size: 18px;
  line-height: 1;
}
.scr-write__dots {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}
.scr-write__dots i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ede8e0;
}
.scr-write__dots i.is-active {
  background: #6366f1;
  transform: scale(1.4);
}
.scr-write__step {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #6f6a65;
  flex: none;
}
.scr-write__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 26px 18px 18px;
}
.scr-write__q {
  margin: 0;
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.2;
  color: #2d2a26;
}
.scr-write__input {
  flex: 1;
  padding: 15px 16px;
  background: #ffffff;
  border: 1px solid #6366f1;
  border-radius: 16px;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  font-size: 14px;
  line-height: 1.6;
  color: #2d2a26;
}
.scr-write__input .caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  background: #6366f1;
  vertical-align: -2px;
  margin-left: 1px;
}
.scr-write__foot {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  padding: 13px 18px 18px;
  border-top: 1px solid rgba(237, 232, 224, 0.6);
}
.scr-write__end,
.scr-write__next {
  height: 38px;
  display: inline-flex;
  align-items: center;
  padding: 0 16px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 12.5px;
}
.scr-write__end {
  background: #ffffff;
  color: #2d2a26;
  border: 1px solid #ede8e0;
}
.scr-write__next {
  background: #6366f1;
  color: #ffffff;
  box-shadow: 0 1px 2px rgba(99, 102, 241, 0.18), 0 6px 18px rgba(99, 102, 241, 0.22);
}

/* ── Screen 2 · the Back me QR page ──────────────────────────────── */
.scr-qr {
  background: #f5f3ef;
  padding: 42px 22px 22px;
  display: block;
}
.scr-qr__brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 22px;
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 17px;
  color: #1f1d1a;
}
.scr-qr__tabs {
  display: flex;
  gap: 24px;
  margin: 0 0 24px;
  border-bottom: 1px solid #e8e3d8;
}
.scr-qr__tab {
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
  color: #6f6a62;
  padding: 8px 2px;
  position: relative;
}
.scr-qr__tab.is-active {
  color: #1f1d1a;
}
.scr-qr__tab.is-active::after {
  content: &quot;&quot;;
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: #1f1d1a;
  border-radius: 2px;
}
.scr-qr__card {
  text-align: center;
  max-width: 234px;
  margin: 6px auto 0;
  padding: 24px 20px 22px;
  background: #fffdf7;
  border: 1px solid #e8e3d8;
  border-radius: 22px;
  box-shadow: 0 12px 34px rgba(45, 42, 38, 0.10);
}
.scr-qr__photo {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  margin: 0 auto 12px;
  overflow: hidden;
  border: 3px solid #fffdf7;
  box-shadow: 0 4px 14px rgba(45, 42, 38, 0.16);
  display: block;
}
.scr-qr__photo svg { display: block; }
.scr-qr__name {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.01em;
  margin: 0 0 3px;
  color: #1f1d1a;
}
.scr-qr__role {
  margin: 0 0 16px;
  font-size: 12px;
  color: #6f6a62;
}
.scr-qr__qr {
  width: 168px;
  height: 168px;
  margin: 0 auto 14px;
}
.scr-qr__qr svg {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 6px;
}
.scr-qr__scan {
  margin: 0;
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-size: 13px;
  color: #1f1d1a;
}

  bottom: 0;
  width: 2px;
  background: #ede8e0;
}
.timeline-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #2d5a3d;
  flex-shrink: 0;
  margin-top: 6px;
}
.timeline-dot.future {
  background: #fffdf7;
  border: 2px solid #c8b6e2;
  width: 20px;
  height: 20px;
  margin-top: 8px;
  margin-left: 2px;
}
.timeline-date {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 30px;
  color: #2d5a3d;
  line-height: 1.1;
  margin: 0 0 6px;
}
.timeline-date.future { color: #6f6a65; }
.timeline-event {
  font-size: 26px;
  color: #2d2a26;
  line-height: 1.35;
  margin: 0;
}
.timeline-event.future { color: #6f6a65; }

/* Ask slide — visual breakdown */
section.ask { justify-content: flex-start; }
section.ask .ask-amount {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 96px;
  line-height: 1;
  letter-spacing: -0.04em;
  color: #2d5a3d;
  margin: 16px 0 12px;
}
section.ask .ask-period {
  font-family: &quot;Fraunces&quot;, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 24px;
  color: #6f6a65;
  margin: 0 0 32px;
}
section.ask .ask-bar {
  display: flex;
  width: 100%;
  height: 36px;
  border-radius: 8px;
  overflow: hidden;
  margin: 0 0 28px;
  box-shadow: 0 4px 12px rgba(45, 42, 38, 0.08);
}
section.ask .ask-bar-segment { height: 100%; }
section.ask .ask-bar-segment.year1  { background: #2d5a3d; flex-basis: 62%; }
section.ask .ask-bar-segment.year2  { background: #7bc47a; flex-basis: 37%; }
section.ask .ask-bar-segment.beyond { background: #f9a8d4; flex-basis: 1%; }

section.ask .ask-section {
  margin-top: 22px;
}
section.ask .ask-section:first-of-type { margin-top: 4px; }
section.ask .ask-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #ede8e0;
  margin-bottom: 6px;
}
section.ask .ask-section-name {
  font-family: &quot;Inter&quot;, sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #6f6a65;
}
section.ask .ask-section-total {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 18px;
  color: #2d5a3d;
}
section.ask .ask-section .ask-legend-item {
  padding: 4px 0;
}
section.ask .ask-legend {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin: 0 0 32px;
}
section.ask .ask-legend-item {
  display: flex;
  align-items: baseline;
  gap: 14px;
  font-size: 24px;
  line-height: 1.3;
}
section.ask .ask-legend-dot {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  flex-shrink: 0;
  transform: translateY(2px);
}
section.ask .ask-legend-dot.year1  { background: #2d5a3d; }
section.ask .ask-legend-dot.year2  { background: #7bc47a; }
section.ask .ask-legend-dot.beyond { background: #f9a8d4; }
section.ask .ask-legend-amount {
  font-family: &quot;Fraunces&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  color: #2d2a26;
}
section.ask .ask-legend-label { color: #2d2a26; }
section.ask .ask-callout {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 10px 0 0 30px;
  padding: 12px 16px;
  background: rgba(45, 90, 61, 0.07);
  border-left: 4px solid #2d5a3d;
  border-radius: 8px;
  font-size: 20px;
  line-height: 1.4;
  color: #2d2a26;
}
section.ask .ask-callout-amount {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 24px;
  color: #2d5a3d;
  flex-shrink: 0;
}
section.ask .ask-callout strong { color: #2d5a3d; font-weight: 700; }
section.ask .ask-footer {
  font-size: 20px;
  color: #6f6a65;
  font-style: italic;
  line-height: 1.45;
  margin: 0;
}

/* Transition slide — gentle pivot from problem to solution */
section.transition {
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 96px 48px;
}
section.transition .transition-line {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-style: italic;
  font-weight: 500;
  font-size: 52px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: #2d5a3d;
  margin: 0;
  max-width: 90%;
}

/* Problem slide — one page-filling statement */
section.problem {
  justify-content: center;
}
section.problem &gt; h1 {
  font-size: 36px;
  color: #6f6a65;
  margin: 0 0 32px;
  font-weight: 600;
}
section.problem .problem-statement {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 84px;
  line-height: 1.05;
  letter-spacing: -0.025em;
  color: #2d2a26;
  margin: 0;
  max-width: 100%;
}
section.problem .problem-statement em {
  color: #2d5a3d;
  font-style: italic;
}

/* Team slide — photo + one statement */
section.team { justify-content: flex-start; }
.team-photo {
  display: block;
  width: 280px;
  height: 280px;
  margin: 32px auto 28px;
  border-radius: 50%;
  overflow: hidden;
  background: #2d5a3d;
  box-shadow: 0 12px 32px rgba(45, 42, 38, 0.16);
}
.team-photo svg, .team-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.team-photo img {
  color: transparent;
  font-size: 0;
}
.team-name {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 44px;
  color: #2d2a26;
  text-align: center;
  margin: 0 0 24px;
  letter-spacing: -0.02em;
}
.team-name--lone {
  font-size: 56px;
  margin-top: 56px;
}
.team-learned-label {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-style: italic;
  font-weight: 600;
  font-size: 56px;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: #2d5a3d;
  text-align: center;
  margin: 72px auto 0;
  max-width: 600px;
}
.team-statement {
  font-size: 30px;
  color: #2d2a26;
  text-align: center;
  margin: 0 auto;
  max-width: 600px;
  line-height: 1.4;
}

/* Market slide — two markets, developers + makers */
section.market .tam-headline {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 80px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: #2d5a3d;
  margin: 0 0 28px;
}
section.market .tam-math {
  font-size: 30px;
  line-height: 1.4;
  color: #2d2a26;
  margin: 0 0 22px;
}
section.market .market-split {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin: 0 0 24px;
  border: 2px solid #2d5a3d;
  border-radius: 8px;
  overflow: hidden;
}
section.market .market-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  background: #fbf8f0;
}
section.market .market-row + .market-row {
  border-top: 1px solid #ede8e0;
}
section.market .market-row .label {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 26px;
  color: #2d2a26;
}
section.market .market-row .value {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 28px;
  color: #2d5a3d;
}
section.market .market-row .sub {
  display: block;
  font-family: &quot;Instrument Sans&quot;, &quot;Inter&quot;, sans-serif;
  font-weight: 400;
  font-size: 16px;
  color: #6f6a65;
  margin-top: 4px;
}
section.market .tam-footnote {
  font-size: 22px;
  color: #6f6a65;
  line-height: 1.5;
  margin: 0;
}

/* Traction slide — one big number */
section.traction .big-number {
  font-family: &quot;Fraunces&quot;, &quot;Plus Jakarta Sans&quot;, Georgia, &quot;Times New Roman&quot;, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;
  font-weight: 700;
  font-size: 144px;
  line-height: 1;
  letter-spacing: -0.04em;
  color: #2d5a3d;
  margin: 0;
}
section.traction .big-number-label {
  font-size: 36px;
  line-height: 1.4;
  color: #2d2a26;
  margin: 12px 0 0;
  max-width: 880px;
}
section.traction .evidence-note {
  margin-top: 28px;
  padding: 14px 18px;
  background: rgba(45, 90, 61, 0.06);

  border-radius: 0 6px 6px 0;
  font-family: &quot;Inter&quot;, sans-serif;
  font-size: 13px;
  line-height: 1.5;

}
section.traction .evidence-note-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #2d5a3d;
  margin: 0 0 6px;
}
section.traction .evidence-note-text {
  margin: 0;
}
section.traction .evidence-note-text strong {
  font-family: &quot;Fraunces&quot;, Georgia, serif;
  font-variation-settings: &quot;SOFT&quot; 100, &quot;WONK&quot; 0, &quot;opsz&quot; 144;

}
