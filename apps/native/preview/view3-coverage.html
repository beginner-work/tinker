<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tinker · Coverage (one at a time)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f8fa;
        --ink: #1f2328;
        --muted: #656d76;
        --line: #d0d7de;
        --surface: #ffffff;
        --accent: #0969da;
        --ok: #1a7f37;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        font-family: "Instrument Sans", system-ui, sans-serif;
        color: var(--ink);
      }
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 36px;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid #30363d;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
      }
      .top {
        padding: 54px 20px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-family: Fraunces, Georgia, serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 4px;
      }
      .sub {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .meta strong { color: var(--ink); font-weight: 600; }
      .counts {
        display: flex;
        gap: 16px;
        padding: 14px 20px 0;
        font-size: 13px;
        font-weight: 600;
      }
      .ok { color: var(--ok); }
      .gap { color: #b4533c; }
      .stage {
        flex: 1;
        padding: 16px 20px 0;
        min-height: 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 20px;
        min-height: 340px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .eyebrow {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .idea {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.25;
      }
      .rule {
        height: 1px;
        background: var(--line);
        margin: 6px 0;
      }
      .surface {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .badge {
        margin-top: auto;
        align-self: flex-start;
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        background: #dafbe1;
        color: var(--ok);
        border: 1px solid #4ac26b66;
      }
      .footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 16px 28px;
      }
      .dots { display: flex; align-items: center; gap: 6px; }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line);
      }
      .dot.on { background: var(--accent); width: 18px; border-radius: 4px; }
      .hint, .counter { margin: 0; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="top">
        <p class="brand">Coverage</p>
        <p class="sub">One at a time — swipe through</p>
        <p class="meta">
          <strong>Pitch · Everyone is a founder.</strong><br />
          Repository · tinker
        </p>
      </header>
      <div class="counts">
        <span class="ok">Covered: 3</span>
        <span class="gap">Gap: 1</span>
      </div>
      <div class="stage">
        <article class="card">
          <p class="eyebrow">Your words</p>
          <p class="idea">Everyone is a founder.</p>
          <div class="rule"></div>
          <p class="eyebrow">In your app</p>
          <p class="surface">First open</p>
          <span class="badge">Aligned</span>
        </article>
      </div>
      <footer class="footer">
        <p class="counter">1 of 4 · Aligned</p>
        <div class="dots" aria-hidden="true">
          <span class="dot on"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <p class="hint">Swipe for the next one</p>
      </footer>
    </div>
  </body>
</html>
