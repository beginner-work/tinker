<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tinker · Coverage (swipe pairs)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f8fa;
        --ink: #1f2328;
        --muted: #656d76;
        --line: #d0d7de;
        --surface: #ffffff;
        --accent: #0969da;
        --ok: #1a7f37;
        --warn: #9a6700;
        --pill: #eaeef2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        font-family: "Instrument Sans", system-ui, sans-serif;
        color: var(--ink);
      }
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 36px;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid #30363d;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
      }
      .top {
        padding: 54px 20px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-family: Fraunces, Georgia, serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 6px;
      }
      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      .meta strong { color: var(--ink); font-weight: 600; }
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 16px 16px 0;
        min-height: 0;
      }
      .pair {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        min-height: 0;
      }
      .pane {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .body {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
        color: var(--ink);
        flex: 1;
      }
      .surface-name {
        font-family: Fraunces, Georgia, serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0;
        flex: 1;
      }
      .footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px 16px 28px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        background: #dafbe1;
        color: var(--ok);
        border: 1px solid #4ac26b66;
      }
      .dots { display: flex; gap: 6px; }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line);
      }
      .dot.on { background: var(--accent); width: 18px; border-radius: 4px; }
      .hint { margin: 0; font-size: 12px; color: var(--muted); }
      .counter { margin: 0; font-size: 12px; color: var(--muted); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="top">
        <p class="brand">tinker</p>
        <p class="meta">
          <strong>Pitch · no AI-written content</strong><br />
          Repository · tinker
        </p>
      </header>
      <div class="stage">
        <div class="pair">
          <section class="pane">
            <p class="label">Your words</p>
            <p class="body">no AI-written content</p>
          </section>
          <section class="pane">
            <p class="label">In your app</p>
            <p class="surface-name">First open</p>
          </section>
        </div>
      </div>
      <footer class="footer">
        <span class="badge">Aligned</span>
        <div class="dots" aria-hidden="true">
          <span class="dot on"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <p class="counter">1 of 4</p>
        <p class="hint">Swipe for the next pair</p>
      </footer>
    </div>
  </body>
</html>
