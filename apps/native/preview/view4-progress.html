<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tinker · Progress feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f1ef;
        --ink: #2d2a26;
        --muted: #6f6a65;
        --soft: #a39e96;
        --line: #e5e1d8;
        --surface: #ffffff;
        --accent: #2d5a3d;
        --tech-bg: #9a9590;
        --tech-border: #857f78;
        --tech-body: #f0ece6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        font-family: "Instrument Sans", system-ui, sans-serif;
        color: var(--ink);
      }
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 36px;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid #30363d;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .scroll {
        height: 100%;
        overflow: auto;
        padding: 54px 20px 40px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .back {
        display: flex; align-items: center; gap: 2px;
        font-size: 15px; font-weight: 500; color: var(--ink);
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .title {
        margin: 0 0 6px;
        font-family: Fraunces, Georgia, serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
      .block { margin-bottom: 36px; }
      .head {
        display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px;
      }
      .avatar {
        width: 28px; height: 28px; border-radius: 999px;
        background: #7bc47a; color: #fffdf7;
        display: grid; place-items: center;
        font-size: 13px; font-weight: 700;
      }
      .meta { flex: 1; font-size: 14px; line-height: 1.35; }
      .meta strong { font-weight: 700; }
      .when { font-size: 13px; color: var(--soft); margin-top: 2px; }
      .stack {
        margin-left: 38px;
        position: relative;
        padding-bottom: 24px;
      }
      .tech {
        position: absolute;
        background: var(--tech-bg);
        border: 1px solid var(--tech-border);
        border-radius: 14px;
        padding: 8px 14px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .tech.t1 { bottom: 0; left: 0; right: 0; z-index: 2; }
      .tech.t2 { bottom: 8px; left: 5px; right: 5px; z-index: 1; }
      .tech.t3 { bottom: 16px; left: 10px; right: 10px; z-index: 0; }
      .source {
        position: relative;
        z-index: 3;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 2px 10px rgba(45, 42, 38, 0.08);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .repo { margin: 0; font-size: 13px; color: var(--muted); font-weight: 500; }
      .lane {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .lane.source { color: var(--accent); }
      .lane.tech { color: #fffdf7; }
      .body {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }
      .tech-body {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--tech-body);
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="scroll">
        <div class="top">
          <span class="back">← Back</span>
          <span class="chip">Light</span>
        </div>
        <p class="title">Progress</p>
        <p class="sub">No source in the feed — only progress.</p>

        <div class="block">
          <div class="head">
            <div class="avatar">M</div>
            <p class="meta">Maya contributed to <strong>Progress</strong></p>
            <span class="when">Just now</span>
          </div>
          <div class="stack">
            <div class="tech t3">
              <p class="tech-body">Coverage maps a pitch idea to code files</p>
            </div>
            <div class="tech t2">
              <p class="tech-body">Feed shows progress without source</p>
            </div>
            <div class="tech t1">
              <p class="tech-body">Native shell on Expo</p>
            </div>
            <article class="source">
              <p class="repo">tinker / Progress</p>
              <p class="lane source">Source idea</p>
              <p class="body">Everyone is a founder.</p>
            </article>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
